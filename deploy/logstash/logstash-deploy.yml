---
# Развертывание Logstash на удаленном хосте без доступа к интернету.
#
# Что делает плейбук:
#   1. На хосте управления: скачивает Docker образ и сохраняет в dist/ (один раз)
#   2. На удаленном хосте: создает структуру каталогов, копирует конфиги и образ,
#      загружает образ в Docker, запускает контейнер через docker compose.
#   3. При повторном запуске: обновляет конфиги, перезапускает контейнер если были изменения.
#
# Использование:
#   cd deploy/logstash && ansible-playbook logstash-deploy.yml
#   ansible-playbook deploy/logstash/logstash-deploy.yml
#   ansible-playbook deploy/logstash/logstash-deploy.yml -e force_image_rebuild=true
#
# Требования на хосте управления:
#   - Docker (для pull + save)
#   - Ansible 2.12+
#   - SSH-ключ настроен для непривилегированного пользователя на целевом хосте
#
# Требования на удаленном хосте:
#   - Docker 24+ и Docker Compose v2
#   - SSH-пользователь должен быть в группе docker (sudo НЕ требуется)
#   - Все файлы Logstash разворачиваются в ~/ueba-logstash под этим пользователем

- name: Подготовка Docker-образа Logstash на хосте управления
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ playbook_dir }}/../../dist"
    logstash_image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    image_archive: "{{ artifacts_dir }}/logstash-image.tar.gz"
    force_image_rebuild: false

  tasks:
    - name: Создать каталог dist для артефактов
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"

    - name: Проверить наличие архива образа
      ansible.builtin.stat:
        path: "{{ image_archive }}"
      register: image_archive_stat

    - name: Скачать образ Logstash
      ansible.builtin.command:
        cmd: docker pull "{{ logstash_image }}"
      when: not image_archive_stat.stat.exists or (force_image_rebuild | bool)
      changed_when: true

    - name: Сохранить образ в архив dist/logstash-image.tar.gz
      ansible.builtin.shell:
        cmd: docker save "{{ logstash_image }}" | gzip > "{{ image_archive }}"
      when: not image_archive_stat.stat.exists or (force_image_rebuild | bool)
      changed_when: true

    - name: Показать размер архива образа
      ansible.builtin.command:
        cmd: du -sh "{{ image_archive }}"
      changed_when: false
      register: archive_size

    - name: Вывести информацию об архиве
      ansible.builtin.debug:
        msg: "Архив образа: {{ archive_size.stdout }}"


- name: Развертывание Logstash на удаленном хосте
  hosts: logstash
  become: false
  gather_facts: false

  vars:
    logstash_image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    deploy_dir: ~/ueba-logstash
    image_archive_local: "{{ playbook_dir }}/../../dist/logstash-image.tar.gz"
    image_archive_remote: /tmp/logstash-image.tar.gz

  tasks:
    - name: Проверить, запущен ли контейнер logstash
      ansible.builtin.command:
        cmd: docker ps -q --filter name=ueba-logstash --filter status=running
      register: pre_run_status
      changed_when: false
      failed_when: false

    - name: Создать структуру каталогов развертывания
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ deploy_dir }}"
        - "{{ deploy_dir }}/logstash/config"
        - "{{ deploy_dir }}/logstash/pipeline"
        - "{{ deploy_dir }}/logstash/patterns"

    - name: Развернуть docker-compose.yml
      ansible.builtin.copy:
        src: docker-compose.logstash.yml
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"
      register: compose_changed

    - name: Создать каталог для сертификатов
      ansible.builtin.file:
        path: "{{ deploy_dir }}/certs"
        state: directory
        mode: "0755"

    - name: Скопировать CA-сертификат OpenSearch
      ansible.builtin.copy:
        src: "{{ opensearch_ca_cert_src }}"
        dest: "{{ deploy_dir }}/certs/opensearch-ca.pem"
        mode: "0644"
      register: cfg_ca_cert

    - name: Развернуть .env с креденшалами OpenSearch
      ansible.builtin.template:
        src: templates/.env.j2
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"
      register: cfg_env
      no_log: true

    - name: Развернуть logstash/config/logstash.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../logstash/config/logstash.yml"
        dest: "{{ deploy_dir }}/logstash/config/logstash.yml"
        mode: "0644"
      register: cfg_logstash_yml

    - name: Развернуть logstash/config/pipelines.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../logstash/config/pipelines.yml"
        dest: "{{ deploy_dir }}/logstash/config/pipelines.yml"
        mode: "0644"
      register: cfg_pipelines_yml

    - name: Развернуть logstash/pipeline/ueba-main.conf
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../logstash/pipeline/ueba-main.conf"
        dest: "{{ deploy_dir }}/logstash/pipeline/ueba-main.conf"
        mode: "0644"
      register: cfg_pipeline

    - name: Проверить наличие образа Logstash на удаленном хосте
      ansible.builtin.command:
        cmd: docker images -q "{{ logstash_image }}"
      register: image_check
      changed_when: false

    - name: Скопировать архив образа на удаленный хост
      ansible.builtin.copy:
        src: "{{ image_archive_local }}"
        dest: "{{ image_archive_remote }}"
        mode: "0644"
      when: image_check.stdout == ""

    - name: Загрузить образ Logstash в Docker
      ansible.builtin.command:
        cmd: docker load -i "{{ image_archive_remote }}"
      when: image_check.stdout == ""
      changed_when: true

    - name: Удалить временный архив с удаленного хоста
      ansible.builtin.file:
        path: "{{ image_archive_remote }}"
        state: absent
      when: image_check.stdout == ""

    - name: Запустить Logstash (первое развертывание или после остановки)
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ deploy_dir }}"
      when: pre_run_status.stdout == ""
      changed_when: true

    - name: Перезапустить Logstash (обновление конфигов или compose-файла)
      ansible.builtin.command:
        cmd: docker compose restart logstash
        chdir: "{{ deploy_dir }}"
      when:
        - pre_run_status.stdout != ""
        - >-
          cfg_logstash_yml.changed or
          cfg_pipelines_yml.changed or
          cfg_pipeline.changed or
          compose_changed.changed or
          cfg_env.changed or
          cfg_ca_cert.changed
      changed_when: true

    - name: Показать статус контейнера
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ deploy_dir }}"
      changed_when: false
      register: compose_status

    - name: Вывести статус
      ansible.builtin.debug:
        msg: "{{ compose_status.stdout_lines }}"
