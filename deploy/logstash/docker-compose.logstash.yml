version: "3.8"

# Docker Compose для автономного развертывания Logstash на удаленном хосте.
# Этот файл развертывается плейбуком ansible/logstash-deploy.yml в /opt/ueba-logstash/.
#
# Конфиги монтируются из ./logstash/ (относительно этого файла):
#   ./logstash/pipeline/ueba-main.conf  — пайплайн нормализации
#   ./logstash/config/logstash.yml      — настройки Logstash
#   ./logstash/config/pipelines.yml     — список пайплайнов

networks:
  ueba-net:
    driver: bridge

services:
  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: ueba-logstash
    restart: unless-stopped
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./logstash/patterns:/usr/share/logstash/patterns:ro
    ports:
      - "5044:5044"   # beats (sysmon)
      - "5045:5045"   # auditd TCP
      - "5046:5046"   # winevtlog TCP
      - "5047:5047"   # sshd TCP
      - "5048:5048"   # osquery TCP
      - "5049:5049"   # suricata TCP
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - ueba-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600 | grep -q 'green'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
