---
# =============================================================================
# Переменные развертывания Logstash
# =============================================================================
#
# Чтобы задать пароль OpenSearch:
#   ansible-vault create deploy/logstash/host_vars/<хост>.yml
#   в файле: opensearch_password: "<пароль>"
#
# Запуск с vault:
#   ansible-playbook logstash-deploy.yml --ask-vault-pass
#
# CA-сертификат OpenSearch ожидается в deploy/logstash/files/opensearch-ca.pem
# (см. opensearch_ca_cert_src). Файл .gitignore'd — копируется на хост Ansible'ом.
# =============================================================================

logstash_image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
deploy_dir: ~/ueba-logstash

# OpenSearch endpoint (продакшн — TLS + Security plugin)
opensearch_url: "https://opensearch.ueba.internal:9200"
opensearch_user: "logstash_writer"
# opensearch_password: см. ansible-vault (host_vars/<host>.yml)

# CA-сертификат для проверки TLS-сертификата OpenSearch
opensearch_ca_cert_src: "files/opensearch-ca.pem"

# Адрес, на который Logstash биндит TCP-порты приёма событий.
# В проде — раскомментировать и указать внутренний интерфейс,
# чтобы порты не торчали в публичную сеть.
# logstash_bind_addr: 10.0.0.5
