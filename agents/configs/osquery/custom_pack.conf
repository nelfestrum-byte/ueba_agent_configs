    "files_checksum": {
      "query": "SELECT path, md5 FROM hash WHERE (path LIKE '/%bin/%' OR path LIKE '/etc/ssh/sshd_config' OR path LIKE '/etc/%' OR path LIKE '/root/.bashrc' OR path LIKE '/root/.profile' OR path LIKE '/home/%/%' OR path LIKE '/usr/lib/x86_64-linux-gnu/%' OR path LIKE '/usr/lib/modules/%' OR path LIKE '/etc/%/%' OR path LIKE '/var/spool/cron/crontabs/%' OR path LIKE '/boot/%');",
      "platform": "linux",
      "interval": 300,
      "removed": false,
      "description": "Retrieves changing file's checksum"
    },
    "firefox_certs_checksum": {
      "query": "SELECT path, md5 FROM hash WHERE (directory LIKE '/home/%/.mozilla/firefox/%' OR directory LIKE '/root/.mozilla/firefox/%') AND (path LIKE '%cert9%' OR path LIKE '%key4%');",
      "platform": "linux",
      "interval": 300,
      "removed": false,
      "description": "Retrieves changing firefox certs checksum"
    },
