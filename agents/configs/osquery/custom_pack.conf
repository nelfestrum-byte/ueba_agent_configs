    "logons_with_timestamp": {
      "query": "SELECT strftime('%Y-%m-%d %H:%M:%S',time,'unixepoch') AS time, username, type, type_name, host, tty, pid FROM last;",
      "interval": 60,
      "removed": false,
      "description": "logons with timestamp"
    },
    "process_cmd_with_timestamp_username": {
      "query": "SELECT pid, name, cmdline, (SELECT username FROM users WHERE uid = processes.uid) AS username, CASE WHEN euid = 0 AND uid != 0 THEN 'Yes' ELSE 'No' END AS is_sudo, strftime('%Y-%m-%d %H:%M:%S', start_time, 'unixepoch') AS start_time_formatted FROM processes WHERE cmdline != '' ORDER BY start_time_formatted ASC;",
      "interval": 60,
      "removed": false,
      "description": "process cmd with timestamp and username"
    },
    "users_shell_history": {
      "query": "SELECT u.username, sh.command FROM users u CROSS JOIN shell_history sh USING (uid);",
      "interval": 60,
      "removed": false,
      "description": "users shell history"
    },
    "logons_day_hour": {
      "query": "select username, tty, host, strftime('%w', datetime(time, 'unixepoch', 'localtime')) AS day_of_week_num, CASE strftime('%w', datetime(time, 'unixepoch', 'localtime')) WHEN '0' THEN 'Sunday' WHEN '1' THEN 'Monday' WHEN '2' THEN 'Tuesday' WHEN '3' THEN 'Wednesday' WHEN '4' THEN 'Thursday' WHEN '5' THEN 'Friday' WHEN '6' THEN 'Saturday' END AS day_of_week, strftime('%H', datetime(time, 'unixepoch', 'localtime')) AS hour, datetime(time, 'unixepoch', 'localtime') AS login_time, type_name FROM last ORDER BY time ASC;",
      "interval": 60,
      "removed": false,
      "description": "logons with day of week and hour"
    },
