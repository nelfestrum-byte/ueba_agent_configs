# ── Парсер для строк auditd ────────────────────────────────────────────────────
# Формат: type=SYSCALL msg=audit(1613845287.701:6542): arch=c000003e ...
[PARSER]
    Name        auditd_line
    Format      regex
    Regex       ^type=(?<audit_type>[A-Z0-9_]+) msg=audit\((?<audit_epoch>[0-9]+)\.(?<audit_ms>[0-9]+):(?<serial>[0-9]+)\):\s*(?<msg>.*)$
    Time_Key    audit_epoch
    Time_Format %s
    Time_Keep   On
    Types       serial:integer audit_ms:integer

# ── Парсер для USER_* событий (msg содержит op= acct= exe= ... res=) ───────────
[PARSER]
    Name        auditd_user_msg
    Format      regex
    Regex       op=(?<op>[^ ]+) (?:grantors=(?<grantors>[^ ]+) )?acct="(?<acct>[^"]*)" exe="(?<exe>[^"]*)" hostname=(?<hostname>[^ ]+) addr=(?<addr>[^ ]+) terminal=(?<terminal>[^ ]+) res=(?<res>[^ ]+)

# ── Парсер для SYSCALL msg-поля (key=value пары) ───────────────────────────────
[PARSER]
    Name        auditd_kv
    Format      logfmt

# ── JSON парсер (оставлен для совместимости / будущего использования) ──────────
[PARSER]
    Name        json
    Format      json
    Time_Key    unixTime
    Time_Format %s
    Time_Keep   On

# ── Парсер syslog-формата для /var/log/auth.log ────────────────────────────────
# Формат: "May 21 10:00:00 hostname sshd[1234]: message"
# Time без года — fluent-bit подставляет текущий; неоднозначность вокруг 31 дек. приемлема.
[PARSER]
    Name        syslog_sshd
    Format      regex
    Regex       ^(?<timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}) (?<hostname>\S+) (?<program>[^\[\s:]+)(?:\[(?<pid>\d+)\])?: (?<message>.*)$
    Time_Key    timestamp
    Time_Format %b %e %H:%M:%S
    Time_Keep   On
