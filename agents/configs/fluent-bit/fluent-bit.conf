# /etc/fluent-bit/fluent-bit.conf
#
# Стек: auditd → fluent-bit → Logstash (TCP 5045) → OpenSearch (fluent-audit-*)
#
# Запуск:
#   systemctl enable --now fluent-bit
#
# Переменные окружения — /etc/default/fluent-bit (EnvironmentFile в systemd unit):
#   LOGSTASH_HOST=logstash.ueba.internal
#
# Доступ к /var/log/audit/audit.log:
#   Вариант 1 (через log_group): задать `log_group = adm` в /etc/audit/auditd.conf,
#              затем usermod -aG adm fluent-bit && systemctl restart auditd
#   Вариант 2 (ACL): setfacl -m u:fluent-bit:r /var/log/audit/audit.log
#                    setfacl -m d:u:fluent-bit:r /var/log/audit/
#
# Важные настройки auditd для корректной работы merge-скрипта:
#   end_of_event_timeout = 2   — генерирует EOE-записи (маркер конца набора)
#   log_format = ENRICHED      — обогащённый формат (имена пользователей и пр.)

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Log_File                  /var/log/fluent-bit/fluent-bit.log
    Parsers_File              /etc/fluent-bit/parsers.conf
    HTTP_Server               On
    HTTP_Listen               127.0.0.1
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/storage/
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 50M
    storage.metrics           On

# ── INPUT: читаем audit.log построчно ──────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               auditd.raw
    Path              /var/log/audit/audit.log
    Parser            auditd_line
    DB                /var/lib/fluent-bit/auditd.db
    DB.locking        true
    Skip_Long_Lines   On
    Refresh_Interval  5
    Read_from_Head    false
    Mem_Buf_Limit     32MB
    storage.type      filesystem

# ── FILTER 1: отбрасываем EOE-строки до Lua ────────────────────────────────────
# EOE нужны только как сигнал для merge-скрипта; сам скрипт их не пропустит,
# но grep позволяет не гонять их лишний раз через pipeline.
[FILTER]
    Name    grep
    Match   auditd.raw
    Exclude audit_type ^(EOE)$

# ── FILTER 2: Lua — объединяем записи по serial number ─────────────────────────
[FILTER]
    Name    lua
    Match   auditd.raw
    script  /etc/fluent-bit/scripts/auditd_merge.lua
    call    merge_auditd

# ── FILTER 3: Lua — обогащение в ECS-поля ──────────────────────────────────────
[FILTER]
    Name    lua
    Match   auditd.raw
    script  /etc/fluent-bit/scripts/auditd_enrich.lua
    call    enrich_ecs

# ── FILTER 4: добавляем статические метаданные агента ──────────────────────────
[FILTER]
    Name    record_modifier
    Match   auditd.*
    Record  agent.name              fluent-bit
    Record  agent.type              filebeat-compat
    Record  data_stream.type        logs
    Record  data_stream.dataset     auditd
    Record  data_stream.namespace   security

# ── FILTER 5: убираем служебные поля, ненужные в SIEM ──────────────────────────
[FILTER]
    Name    record_modifier
    Match   auditd.*
    Remove_key audit_type
    Remove_key serial
    Remove_key msg

# ── OUTPUT: auditd → Logstash TCP 5045 → OpenSearch fluent-audit-* ────────────
# Для продакшена с TLS: перейти на output forward + beats-input в Logstash с mTLS.
[OUTPUT]
    Name              tcp
    Match             auditd.*
    Host              ${LOGSTASH_HOST}
    Port              5045
    Format            json_lines
    Retry_Limit       10
    storage.total_limit_size 1G
    net.connect_timeout       10
    net.keepalive             on
    net.keepalive_idle_timeout 30
