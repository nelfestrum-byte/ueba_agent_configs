# /etc/fluent-bit/fluent-bit.conf
#
# Стек:
#   auditd   → fluent-bit → Logstash TCP 5045 → OpenSearch (fluent-audit-*)
#   osquery  → fluent-bit → Logstash TCP 5047 → OpenSearch (fluent-osquery-*)
#
# Запуск:
#   systemctl enable --now fluent-bit
#
# Переменные окружения — /etc/default/fluent-bit (EnvironmentFile в systemd unit):
#   LOGSTASH_HOST=logstash.ueba.internal
#
# Доступ к /var/log/audit/audit.log:
#   Вариант 1 (через log_group): задать `log_group = adm` в /etc/audit/auditd.conf,
#              затем usermod -aG adm fluent-bit && systemctl restart auditd
#   Вариант 2 (ACL): setfacl -m u:fluent-bit:r /var/log/audit/audit.log
#                    setfacl -m d:u:fluent-bit:r /var/log/audit/
#
# Важные настройки auditd для корректной работы merge-скрипта:
#   end_of_event_timeout = 2   — генерирует EOE-записи (маркер конца набора)
#   log_format = ENRICHED      — обогащённый формат (имена пользователей и пр.)

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Log_File                  /var/log/fluent-bit/fluent-bit.log
    Parsers_File              /etc/fluent-bit/parsers.conf
    HTTP_Server               On
    HTTP_Listen               127.0.0.1
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/storage/
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 50M
    storage.metrics           On

# ── INPUT: читаем audit.log построчно ──────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               auditd.raw
    Path              /var/log/audit/audit.log
    Parser            auditd_line
    DB                /var/lib/fluent-bit/auditd.db
    DB.locking        true
    Skip_Long_Lines   On
    Refresh_Interval  5
    Read_from_Head    false
    Mem_Buf_Limit     32MB
    storage.type      filesystem

# ── FILTER: Lua — объединяем записи по serial number ──────────────────────────
# ВАЖНО: EOE-записи должны ДОХОДИТЬ до merge-скрипта — это их единственный
# триггер флаша буфера. Не добавляй grep-exclude на EOE перед этим фильтром.
[FILTER]
    Name    lua
    Match   auditd.raw
    script  /etc/fluent-bit/scripts/auditd_merge.lua
    call    merge_auditd


# ── FILTER: Lua — обогащение в ECS-поля ────────────────────────────────────────
[FILTER]
    Name    lua
    Match   auditd.raw
    script  /etc/fluent-bit/scripts/auditd_enrich.lua
    call    enrich_ecs


# ── FILTER: добавляем статические метаданные агента ────────────────────────────
[FILTER]
    Name    record_modifier
    Match   auditd.*
    Record  agent.name              fluent-bit
    Record  agent.type              filebeat-compat
    Record  data_stream.type        logs
    Record  data_stream.dataset     auditd
    Record  data_stream.namespace   security


# ── FILTER: убираем служебные поля, ненужные в SIEM ────────────────────────────
[FILTER]
    Name    record_modifier
    Match   auditd.*
    Remove_key audit_type
    Remove_key serial
    Remove_key msg

# ── OUTPUT: auditd → Logstash TCP 5045 → OpenSearch fluent-audit-* ────────────
# Для продакшена с TLS: перейти на output forward + beats-input в Logstash с mTLS.
[OUTPUT]
    Name              tcp
    Match             auditd.*
    Host              ${LOGSTASH_HOST}
    Port              5045
    Format            json_lines
    Retry_Limit       10
    storage.total_limit_size 1G
    net.connect_timeout       10
    net.keepalive             on
    net.keepalive_idle_timeout 30


# =============================================================================
# osquery pipeline: osqueryd.results.log → Logstash TCP 5047 → fluent-osquery-*
# =============================================================================

# ── INPUT: читаем osquery results log (JSON Lines, одно событие на строку) ─
# Права доступа: setfacl -m u:fluent-bit:r /var/log/osquery/osqueryd.results.log
#                setfacl -m d:u:fluent-bit:r /var/log/osquery/
[INPUT]
    Name              tail
    Tag               osquery.raw
    Path              /var/log/osquery/osqueryd.results.log
    Parser            json
    DB                /var/lib/fluent-bit/osquery.db
    DB.locking        true
    Skip_Long_Lines   On
    Refresh_Interval  5
    Read_from_Head    false
    Mem_Buf_Limit     16MB
    storage.type      filesystem

# ── FILTER: Lua — нормализация в ECS + osquery.* namespace ────────────────
[FILTER]
    Name    lua
    Match   osquery.raw
    script  /etc/fluent-bit/scripts/osquery_enrich.lua
    call    enrich_osquery

# ── FILTER: статические метаданные агента ─────────────────────────────────
[FILTER]
    Name    record_modifier
    Match   osquery.*
    Record  agent.name              fluent-bit
    Record  agent.type              osquerybeat-compat
    Record  data_stream.type        logs
    Record  data_stream.dataset     osquery
    Record  data_stream.namespace   security

# ── OUTPUT: osquery → Logstash TCP 5047 → OpenSearch fluent-osquery-* ──────
[OUTPUT]
    Name              tcp
    Match             osquery.*
    Host              ${LOGSTASH_HOST}
    Port              5047
    Format            json_lines
    Retry_Limit       10
    storage.total_limit_size 512M
    net.connect_timeout       10
    net.keepalive             on
    net.keepalive_idle_timeout 30


# =============================================================================
# system-auth pipeline: journald (sshd) → Logstash TCP 5048 → system-auth-*
#
# Читаем из journald — на Debian/Ubuntu 22.04+ без rsyslog /var/log/auth.log
# не создаётся, sshd пишет только через systemd-journald.
# Права: fluent-bit должен быть в группе systemd-journal:
#   usermod -aG systemd-journal fluent-bit && systemctl restart fluent-bit
# =============================================================================

# ── INPUT: читаем события sshd из journald ────────────────────────────────────
[INPUT]
    Name               systemd
    Tag                system.auth
    Systemd_Filter     SYSLOG_IDENTIFIER=sshd
    Systemd_Filter     SYSLOG_IDENTIFIER=sshd-session
    DB                 /var/lib/fluent-bit/sshd-journald.db
    Read_From_Tail     On
    Strip_Underscores  On

# ── FILTER: нормализуем journald-поля в имена, ожидаемые sshd_enrich.lua ──────
# journald (после Strip_Underscores): MESSAGE, SYSLOG_IDENTIFIER, PID (из _PID)
[FILTER]
    Name    modify
    Match   system.auth
    Rename  MESSAGE           message
    Rename  SYSLOG_IDENTIFIER program
    Rename  PID               pid

# ── FILTER: Lua — нормализация sshd-строк в ECS-поля ─────────────────────────
[FILTER]
    Name    lua
    Match   system.auth
    script  /etc/fluent-bit/scripts/sshd_enrich.lua
    call    enrich_sshd

# ── FILTER: метаданные агента + удаление journald-шума ────────────────────────
[FILTER]
    Name    record_modifier
    Match   system.auth
    Record  agent.name              fluent-bit
    Record  agent.type              filebeat-compat
    Record  data_stream.type        logs
    Record  data_stream.dataset     system.auth
    Record  data_stream.namespace   security
    Remove_key PRIORITY
    Remove_key TRANSPORT
    Remove_key SYSTEMD_UNIT
    Remove_key SYSTEMD_CGROUP
    Remove_key SYSTEMD_SLICE
    Remove_key SYSTEMD_INVOCATION_ID
    Remove_key BOOT_ID
    Remove_key MACHINE_ID
    Remove_key HOSTNAME
    Remove_key COMM
    Remove_key EXE
    Remove_key CMDLINE
    Remove_key UID
    Remove_key GID
    Remove_key STREAM_ID
    Remove_key CAP_EFFECTIVE
    Remove_key REALTIME_TIMESTAMP
    Remove_key MONOTONIC_TIMESTAMP

# ── OUTPUT: system-auth → Logstash TCP 5048 → OpenSearch system-auth-* ───────
[OUTPUT]
    Name              tcp
    Match             system.auth
    Host              ${LOGSTASH_HOST}
    Port              5048
    Format            json_lines
    json_date_format  iso8601
    json_date_key     @timestamp
    Retry_Limit       10
    storage.total_limit_size 256M
    net.connect_timeout       10
    net.keepalive             on
    net.keepalive_idle_timeout 30
