# /etc/fluent-bit/fluent-bit.conf — production, bare-metal Debian
#
# Запуск как системный сервис:
#   apt install fluent-bit              # из репозитория https://packages.fluentbit.io/debian/
#   systemctl enable --now fluent-bit
#
# Переменные окружения (LOGSTASH_HOST и пр.):
#   /etc/default/fluent-bit  ←  читается systemd unit как EnvironmentFile.
#     Пример содержимого:
#       LOGSTASH_HOST=logstash.ueba.internal
#       NODE_ENV=prod
#   После правки: `systemctl restart fluent-bit`.
#   ${HOSTNAME} systemd проставляет автоматически из /etc/hostname.
#
# Доступ к файлам:
#   Сервис fluent-bit работает под пользователем `fluent-bit`. Чтобы он мог читать:
#     /var/log/audit/audit.log      → добавить fluent-bit в группу adm
#                                     и настроить `log_group = adm` в /etc/audit/auditd.conf
#     /var/log/osquery/*.log        → osquery пишет 0640 root:root → дать доступ
#                                     через ACL: `setfacl -m u:fluent-bit:r /var/log/osquery/*.log`
#                                     (или logrotate hook на postrotate)
#     journald                      → пользователь fluent-bit добавляется в группу
#                                     systemd-journal (на Debian обычно уже даёт доступ)

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Log_File                  /var/log/fluent-bit/fluent-bit.log
    Parsers_File              /etc/fluent-bit/parsers.conf
    HTTP_Server               On
    HTTP_Listen               127.0.0.1
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/storage/
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 32M
    storage.metrics           On

# ── osquery snapshot метрики ─────────────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               osquery.snapshot
    Path              /var/log/osquery/osqueryd.snapshots.log
    Parser            json
    DB                /var/lib/fluent-bit/osquery-snapshot.db
    DB.Sync           Normal
    Refresh_Interval  5
    Read_from_Head    false
    Skip_Empty_Lines  On
    Mem_Buf_Limit     16MB
    storage.type      filesystem

# ── osquery diff события ─────────────────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               osquery.diff
    Path              /var/log/osquery/osqueryd.results.log
    Parser            json
    DB                /var/lib/fluent-bit/osquery-diff.db
    DB.Sync           Normal
    Refresh_Interval  5
    Read_from_Head    false
    Skip_Empty_Lines  On
    Mem_Buf_Limit     16MB
    storage.type      filesystem

# ── auditd: tail /var/log/audit/audit.log ────────────────────────────────────
# Bare-metal: auditd пишет напрямую в файл (а не в journald), читаем оттуда.
# Поле MESSAGE сохраняем — logstash-пайплайн ожидает его именно под этим именем.
[INPUT]
    Name              tail
    Tag               auditd
    Path              /var/log/audit/audit.log
    Key               MESSAGE
    DB                /var/lib/fluent-bit/auditd.db
    DB.Sync           Normal
    Refresh_Interval  5
    Read_from_Head    false
    Skip_Empty_Lines  On
    Mem_Buf_Limit     32MB
    storage.type      filesystem

# ── sshd: читаем journald напрямую (не /var/log/auth.log) ────────────────────
# На bare-metal Debian journald — канонический источник sshd-событий.
# Читаем по unit-фильтру; поле MESSAGE journald совпадает с тем, что ждёт logstash.
[INPUT]
    Name                systemd
    Tag                 sshd
    Systemd_Filter      _SYSTEMD_UNIT=ssh.service
    Systemd_Filter      _COMM=sshd
    Systemd_Filter_Type Or
    Read_From_Tail      On
    Strip_Underscores   On
    DB                  /var/lib/fluent-bit/sshd.db
    Mem_Buf_Limit       16MB
    storage.type        filesystem

# ── FILTERS ──────────────────────────────────────────────────────────────────

# osquery snapshot → плоский документ для метрик
[FILTER]
    Name    lua
    Match   osquery.snapshot
    script  /etc/fluent-bit/flatten.lua
    call    flatten_snapshot

# osquery diff → плоский документ для конфигурационных событий
[FILTER]
    Name    lua
    Match   osquery.diff
    script  /etc/fluent-bit/flatten.lua
    call    flatten_diff

# Имя хоста ко всем событиям
[FILTER]
    Name    record_modifier
    Match   *
    Record  hostname ${HOSTNAME}

# Для auditd — пропускаем только релевантные UEBA типы
[FILTER]
    Name    grep
    Match   auditd
    Regex   MESSAGE (type=SYSCALL|type=USER_CMD|type=USER_AUTH|type=USER_START|type=USER_END|type=CONFIG_CHANGE)

# Убираем шумные SYSCALL-записи сетевых вызовов и смены привилегий:
# они не дают полезных событий в Logstash, но генерируют 10-15 записей на каждый SSH-сеанс
[FILTER]
    Name    grep
    Match   auditd
    Exclude MESSAGE key="(socket_connect|socket_bind|socket_create|socket_listen|privilege_change)"

# ── OUTPUTS ──────────────────────────────────────────────────────────────────
# Все выходы используют общий ${LOGSTASH_HOST} — порт варьируется по типу события.
# net.* параметры дают back-pressure, а не drop при коротких разрывах сети.
# Когда у Logstash появится TLS — переключить tcp → forward с tls On (см. README).

# osquery snapshot → Logstash 5048
[OUTPUT]
    Name              tcp
    Match             osquery.snapshot
    Host              ${LOGSTASH_HOST}
    Port              5048
    Format            json_lines
    Retry_Limit       False
    storage.total_limit_size 200M
    net.connect_timeout       10
    net.keepalive             on
    net.keepalive_idle_timeout 30

# osquery diff → Logstash 5048
[OUTPUT]
    Name              tcp
    Match             osquery.diff
    Host              ${LOGSTASH_HOST}
    Port              5048
    Format            json_lines
    Retry_Limit       False
    storage.total_limit_size 200M
    net.connect_timeout       10
    net.keepalive             on
    net.keepalive_idle_timeout 30

# auditd → Logstash 5045
[OUTPUT]
    Name              tcp
    Match             auditd
    Host              ${LOGSTASH_HOST}
    Port              5045
    Format            json_lines
    Retry_Limit       False
    storage.total_limit_size 500M
    net.connect_timeout       10
    net.keepalive             on
    net.keepalive_idle_timeout 30

# sshd → Logstash 5047
[OUTPUT]
    Name              tcp
    Match             sshd
    Host              ${LOGSTASH_HOST}
    Port              5047
    Format            json_lines
    Retry_Limit       False
    storage.total_limit_size 100M
    net.connect_timeout       10
    net.keepalive             on
    net.keepalive_idle_timeout 30
