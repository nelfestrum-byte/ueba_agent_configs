# /etc/fluent-bit/conf.d/40-freeipa-inputs.conf
# FreeIPA-специфичные tail inputs (10 сервисов).
# Управляется Ansible (роль fb_freeipa). Не редактировать вручную.

[INPUT]
    Name             tail
    storage.type     filesystem
    Tag              freeipa.kdc
    Path             ${FREEIPA_LOG_BASE}/krb5kdc.log
    Parser           ipa_kdc
    DB               /var/lib/fluent-bit/freeipa_kdc.db
    DB.sync          full
    DB.locking       true
    DB.journal_mode  WAL

[INPUT]
    Name             tail
    storage.type     filesystem
    Tag              freeipa.httpd.access
    Path             ${FREEIPA_LOG_BASE}/httpd/access_log
    Parser           apache_access
    DB               /var/lib/fluent-bit/freeipa_httpd_access.db
    DB.sync          full
    DB.locking       true
    DB.journal_mode  WAL

[INPUT]
    Name             tail
    storage.type     filesystem
    Tag              freeipa.httpd.error
    Path             ${FREEIPA_LOG_BASE}/httpd/error_log
    Parser           apache_error
    DB               /var/lib/fluent-bit/freeipa_httpd_error.db
    DB.sync          full
    DB.locking       true
    DB.journal_mode  WAL

[INPUT]
    Name             tail
    storage.type     filesystem
    Tag              freeipa.dirsrv.access
    Path             ${FREEIPA_LOG_BASE}/dirsrv/slapd-*/access
    Parser           dirsrv_access
    DB               /var/lib/fluent-bit/freeipa_dirsrv_access.db
    DB.sync          full
    DB.locking       true
    DB.journal_mode  WAL

[INPUT]
    Name             tail
    storage.type     filesystem
    Tag              freeipa.dirsrv.error
    Path             ${FREEIPA_LOG_BASE}/dirsrv/slapd-*/errors
    Parser           dirsrv_error
    DB               /var/lib/fluent-bit/freeipa_dirsrv_error.db
    DB.sync          full
    DB.locking       true
    DB.journal_mode  WAL

[INPUT]
    Name             tail
    storage.type     filesystem
    Tag              freeipa.dirsrv.audit
    Path             ${FREEIPA_LOG_BASE}/dirsrv/slapd-*/audit
    Parser           dirsrv_audit
    DB               /var/lib/fluent-bit/freeipa_dirsrv_audit.db
    DB.sync          full
    DB.locking       true
    DB.journal_mode  WAL

[INPUT]
    Name             tail
    storage.type     filesystem
    Tag              freeipa.dirsrv.auditfail
    Path             ${FREEIPA_LOG_BASE}/dirsrv/slapd-*/auditfail
    Parser           dirsrv_audit
    DB               /var/lib/fluent-bit/freeipa_dirsrv_auditfail.db
    DB.sync          full
    DB.locking       true
    DB.journal_mode  WAL

[INPUT]
    Name             tail
    storage.type     filesystem
    Tag              freeipa.dogtag
    Path             ${FREEIPA_LOG_BASE}/pki/pki-tomcat/ca/debug
    Parser           dogtag
    multiline.parser java_stacktrace
    DB               /var/lib/fluent-bit/freeipa_dogtag.db
    DB.sync          full
    DB.locking       true
    DB.journal_mode  WAL

[INPUT]
    Name             tail
    storage.type     filesystem
    Tag              freeipa.dns
    Path             ${FREEIPA_LOG_BASE}/named/*.log,${FREEIPA_LOG_BASE}/named/data/named.run
    Parser           bind_dns
    DB               /var/lib/fluent-bit/freeipa_dns.db
    DB.sync          full
    DB.locking       true
    DB.journal_mode  WAL

[INPUT]
    Name             tail
    storage.type     filesystem
    Tag              freeipa.sssd
    Path             ${FREEIPA_LOG_BASE}/sssd/*.log
    Parser           sssd
    DB               /var/lib/fluent-bit/freeipa_sssd.db
    DB.sync          full
    DB.locking       true
    DB.journal_mode  WAL
