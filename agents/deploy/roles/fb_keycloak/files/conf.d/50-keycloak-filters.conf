# /etc/fluent-bit/conf.d/50-keycloak-filters.conf
# Keycloak event pipeline: извлечение событий из docker-контейнера.
# Управляется Ansible (роль fb_keycloak). Не редактировать вручную.
#
# Предусловие: 85-docker-common-filters.conf уже распарсил docker.* логи.

[FILTER]
    Name    modify
    Match   docker.*
    Rename  log.logger log_logger

[FILTER]
    Name    rewrite_tag
    Match   docker.*
    Rule    $log_logger "org.keycloak.events" keycloak.events false

[FILTER]
    Name   lua
    Match  keycloak.events
    script /etc/fluent-bit/scripts/remove_commas.lua
    call   remove_commas

[FILTER]
    Name         parser
    Parser       logfmt
    Match        keycloak.events
    Key_Name     message
    Reserve_Data true
    Preserve_Key false

[FILTER]
    Name    modify
    Match   keycloak.events
    Rename  log_logger logger

[FILTER]
    Name    rewrite_tag
    Match   keycloak.events
    Rule    $logger "org.keycloak.events" docker.keycloak_events false
