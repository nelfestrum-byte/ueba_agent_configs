{
  "//": "/etc/osquery/packs/bpf.conf — BPF backend queries",
  "//managed": "Управляется Ansible (роль osquery_bpf). Не редактировать вручную.",
  "//requires": "osquery_bpf_events_enabled=true, kernel >= 5.10, CONFIG_DEBUG_INFO_BTF",

  "queries": {

    "docker_containers": {
      "query": "SELECT id, name, image, image_id, state, status, pid, (SELECT hostname FROM system_info) AS hostname FROM docker_containers WHERE state = 'running'",
      "interval": 30,
      "description": "Running container inventory diff — для cgroup_ns_cache в osquery_enrich.lua"
    },

    "bpf_processes": {
      "query": "SELECT * FROM bpf_process_events;",
      "interval": 10,
      "removed": false,
      "description": "Event-driven process creation/exit via eBPF"
    },

    "bpf_sockets": {
      "query": "SELECT * FROM bpf_socket_events;",
      "interval": 10,
      "removed": false,
      "description": "Event-driven socket bind/connect/accept via eBPF"
    }

  }
}
