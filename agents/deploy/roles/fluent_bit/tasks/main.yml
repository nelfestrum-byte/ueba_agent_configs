---
- name: Развернуть fluent-bit.conf (базовый, статический)
  ansible.builtin.copy:
    src: fluent-bit.conf
    dest: /etc/fluent-bit/fluent-bit.conf
    owner: root
    group: root
    mode: "0644"
  notify: fluent-bit changed

- name: Развернуть parsers.conf (базовые парсеры)
  ansible.builtin.copy:
    src: parsers.conf
    dest: /etc/fluent-bit/parsers.conf
    owner: root
    group: root
    mode: "0644"
  notify: fluent-bit changed

- name: Развернуть conf.d/10-auditd.conf
  ansible.builtin.copy:
    src: conf.d/10-auditd.conf
    dest: /etc/fluent-bit/conf.d/10-auditd.conf
    owner: root
    group: root
    mode: "0644"
  notify: fluent-bit changed

- name: Развернуть conf.d/20-osquery.conf
  ansible.builtin.copy:
    src: conf.d/20-osquery.conf
    dest: /etc/fluent-bit/conf.d/20-osquery.conf
    owner: root
    group: root
    mode: "0644"
  notify: fluent-bit changed

- name: Развернуть core Lua скрипты
  ansible.builtin.copy:
    src: "scripts/{{ item }}"
    dest: "/etc/fluent-bit/scripts/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - auditd_merge.lua
    - auditd_enrich.lua
    - osquery_enrich.lua
    - proc_common.lua
  notify: fluent-bit changed

- name: Развернуть /etc/default/fluent-bit (env vars)
  ansible.builtin.template:
    src: fluent-bit.env.j2
    dest: /etc/default/fluent-bit
    owner: root
    group: root
    mode: "0640"
  notify: fluent-bit changed

# ── Shared client-pipeline infrastructure ─────────────────────────────────────
# Условия в Ansible (не в Jinja2 conf-файлах). Conf-файлы статические.

- name: Forward INPUT (keycloak / docker_events / freeipa)
  ansible.builtin.copy:
    src: conf.d/25-forward-input.conf
    dest: /etc/fluent-bit/conf.d/25-forward-input.conf
    mode: "0644"
  when: base_stack | default([]) | intersect(['keycloak', 'docker_events', 'freeipa']) | length > 0
  notify: fluent-bit changed

- name: Remove forward INPUT when unused
  ansible.builtin.file:
    path: /etc/fluent-bit/conf.d/25-forward-input.conf
    state: absent
  when: base_stack | default([]) | intersect(['keycloak', 'docker_events', 'freeipa']) | length == 0
  notify: fluent-bit changed

