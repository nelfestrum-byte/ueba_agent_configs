# /etc/fluent-bit/parsers.conf — базовые парсеры (security pipeline)
# Управляется Ansible (роль fluent_bit).
# Клиентские парсеры: /etc/fluent-bit/parsers.d/*.conf (управляются fb_* ролями)

# ── Security: auditd ──────────────────────────────────────────────────────────

[PARSER]
    Name        auditd_line
    Format      regex
    Regex       ^type=(?<audit_type>[A-Z0-9_]+) msg=audit\((?<audit_epoch>[0-9]+)\.(?<audit_ms>[0-9]+):(?<serial>[0-9]+)\):\s*(?<msg>.*)$
    Time_Key    audit_epoch
    Time_Format %s
    Time_Keep   On
    Types       serial:integer audit_ms:integer

[PARSER]
    Name        auditd_user_msg
    Format      regex
    Regex       op=(?<op>[^ ]+) (?:grantors=(?<grantors>[^ ]+) )?acct="(?<acct>[^"]*)" exe="(?<exe>[^"]*)" hostname=(?<hostname>[^ ]+) addr=(?<addr>[^ ]+) terminal=(?<terminal>[^ ]+) res=(?<res>[^ ]+)

[PARSER]
    Name        auditd_kv
    Format      logfmt

[PARSER]
    Name        json
    Format      json
    Time_Key    unixTime
    Time_Format %s
    Time_Keep   On

[PARSER]
    Name        syslog_sshd
    Format      regex
    Regex       ^(?<timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}) (?<hostname>\S+) (?<program>[^\[\s:]+)(?:\[(?<pid>\d+)\])?: (?<message>.*)$
    Time_Key    timestamp
    Time_Format %b %e %H:%M:%S
    Time_Keep   On
