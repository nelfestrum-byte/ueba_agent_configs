# /etc/fluent-bit/conf.d/25-forward-input.conf
# Forward input для контейнерных логов (keycloak / docker_events / freeipa).
# Управляется Ansible (роль fluent_bit). Не редактировать вручную.

[INPUT]
    name             forward
    storage.type     filesystem
    Listen           0.0.0.0
    Port             ${FLUENT_FORWARD_PORT}
