# /etc/fluent-bit/conf.d/26-docker-api-inputs.conf
# Docker Events API + osquery JSON inputs (docker_events / freeipa).
# Управляется Ansible (роль fluent_bit). Не редактировать вручную.

[INPUT]
    name             docker_events
    storage.type     filesystem
    tag              docker_events
    parser           json
    Unix_Path        ${DOCKER_SOCKET}

[INPUT]
    name              tail
    storage.type      filesystem
    path              /var/log/osquery/osqueryd.*.log
    read_from_Head    true
    parser            json
    tag               osquery_json
    DB                /var/lib/fluent-bit/osquery_client.db
    DB.sync           full
    DB.locking        true
    DB.journal_mode   WAL
