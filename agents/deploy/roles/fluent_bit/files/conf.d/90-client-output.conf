# /etc/fluent-bit/conf.d/90-client-output.conf
# OUTPUT для всех клиентских пайплайнов → Logstash common → data_* индексы.
# Управляется Ansible (роль fluent_bit). Не редактировать вручную.

[OUTPUT]
    Name           tcp
    Match_Regex    ^(docker\.|freeipa\.|docker_events$|suricata_json$|waf_json$|osquery_json$)
    Host           ${LOGSTASH_COMMON_HOST}
    Port           ${LOGSTASH_COMMON_PORT}
    Format         json_lines
    Retry_Limit    5
    net.keepalive  on
