# /etc/fluent-bit/conf.d/10-auditd.conf — auditd security pipeline
# Управляется Ansible (роль fluent_bit). Не редактировать вручную.
# Переменные: /etc/default/fluent-bit

# ══════════════════════════════════════════════════════════════════════════════
# SECURITY PIPELINE — auditd → Logstash TCP → fluent-audit-*
# ══════════════════════════════════════════════════════════════════════════════

[INPUT]
    Name              tail
    Tag               auditd.raw
    Path              /var/log/audit/audit.log
    Parser            auditd_line
    DB                /var/lib/fluent-bit/auditd.db
    DB.locking        true
    Skip_Long_Lines   On
    Refresh_Interval  5
    Read_from_Head    false
    Mem_Buf_Limit     32MB
    storage.type      filesystem

[FILTER]
    Name    lua
    Match   auditd.raw
    script  /etc/fluent-bit/scripts/auditd_merge.lua
    call    merge_auditd

[FILTER]
    Name    lua
    Match   auditd.raw
    script  /etc/fluent-bit/scripts/auditd_enrich.lua
    call    enrich_ecs

[FILTER]
    Name    record_modifier
    Match   auditd.*
    Record  agent.name              fluent-bit
    Record  agent.type              filebeat-compat
    Record  data_stream.type        logs
    Record  data_stream.dataset     auditd
    Record  data_stream.namespace   security
    Record  labels.config_version   ${FLUENT_CONFIG_VERSION}

[FILTER]
    Name    record_modifier
    Match   auditd.*
    Remove_key audit_type
    Remove_key serial
    Remove_key msg

[OUTPUT]
    Name              tcp
    Match             auditd.*
    Host              ${LOGSTASH_SECURITY_HOST}
    Port              ${LOGSTASH_SECURITY_AUDIT_PORT}
    Format            json_lines
    Retry_Limit       10
    storage.total_limit_size 1G
    net.connect_timeout       10
    net.keepalive             on
    net.keepalive_idle_timeout 30
