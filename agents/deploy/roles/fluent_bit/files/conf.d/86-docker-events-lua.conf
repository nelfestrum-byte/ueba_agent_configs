# /etc/fluent-bit/conf.d/86-docker-events-lua.conf
# Lua-санитизация Docker Events API (docker_events / freeipa).
# Управляется Ansible (роль fluent_bit). Не редактировать вручную.

[FILTER]
    Name    lua
    Match   docker_events
    script  /etc/fluent-bit/scripts/docker_events.lua
    call    sanitize_attributes
