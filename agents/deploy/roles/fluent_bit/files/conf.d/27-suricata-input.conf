# /etc/fluent-bit/conf.d/27-suricata-input.conf
# Suricata EVE JSON input (suricata / freeipa).
# Управляется Ansible (роль fluent_bit). Не редактировать вручную.

[INPUT]
    name              tail
    storage.type      filesystem
    path              ${SURICATA_LOG_PATH}
    read_from_Head    true
    parser            json
    tag               suricata_json
    DB                /var/lib/fluent-bit/suricata_client.db
    DB.sync           full
    DB.locking        true
    DB.journal_mode   WAL
