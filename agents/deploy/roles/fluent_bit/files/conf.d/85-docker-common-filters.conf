# /etc/fluent-bit/conf.d/85-docker-common-filters.conf
# Общие фильтры для docker-контейнерных логов (keycloak / docker_events / freeipa).
# Применяется ДО role-специфичных фильтров (50-*).
# Управляется Ansible (роль fluent_bit). Не редактировать вручную.

[FILTER]
    Name    grep
    Match   docker.*
    Regex   log .+

[FILTER]
    name                  multiline
    match                 docker.*
    multiline.key_content log
    mode                  partial_message

[FILTER]
    Name         parser
    Parser       docker
    Match        docker.*
    Key_Name     log
    Reserve_Data true
    Preserve_Key false
