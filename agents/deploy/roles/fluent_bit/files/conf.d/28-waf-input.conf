# /etc/fluent-bit/conf.d/28-waf-input.conf
# WAF / ModSecurity log input (waf / freeipa).
# Управляется Ansible (роль fluent_bit). Не редактировать вручную.

[INPUT]
    name              tail
    storage.type      filesystem
    path              ${WAF_LOG_PATH}
    read_from_Head    false
    parser            json
    tag               waf_json
    DB                /var/lib/fluent-bit/waf_client.db
    DB.sync           full
    DB.locking        true
    DB.journal_mode   WAL
