# /etc/fluent-bit/fluent-bit.conf — базовый security pipeline
# Управляется Ansible (роль fluent_bit). Не редактировать вручную.
#
# Security pipelines (всегда активны):
#   auditd  → TCP ${LOGSTASH_SECURITY_HOST}:${LOGSTASH_SECURITY_AUDIT_PORT}  → fluent-audit-*
#   osquery → TCP ${LOGSTASH_SECURITY_HOST}:${LOGSTASH_SECURITY_OSQUERY_PORT} → fluent-osquery-*
#
# Клиентские pipelines (управляются fb_* ролями):
#   conf.d/*.conf → TCP ${LOGSTASH_COMMON_HOST}:${LOGSTASH_COMMON_PORT} → data_*
#
# Переменные окружения: /etc/default/fluent-bit

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Log_File                  /var/log/fluent-bit/fluent-bit.log
    Parsers_File              /etc/fluent-bit/parsers.conf
    HTTP_Server               On
    HTTP_Listen               127.0.0.1
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/storage/
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 50M
    storage.metrics           On

@INCLUDE /etc/fluent-bit/conf.d/*.conf
