---
- name: docker | metadata conf.d
  ansible.builtin.copy:
    src: conf.d/52-docker-metadata.conf
    dest: /etc/fluent-bit/conf.d/52-docker-metadata.conf
    mode: "0644"
  when: "'docker_events' in base_stack | default([])"
  notify: fluent-bit changed

- name: docker | remove metadata conf.d
  ansible.builtin.file:
    path: /etc/fluent-bit/conf.d/52-docker-metadata.conf
    state: absent
  when: "'docker_events' not in base_stack | default([])"
  notify: fluent-bit changed

- name: docker | docker_events.lua
  ansible.builtin.copy:
    src: scripts/docker_events.lua
    dest: /etc/fluent-bit/scripts/docker_events.lua
    mode: "0644"
  when: base_stack | default([]) | intersect(['docker_events', 'freeipa']) | length > 0
  notify: fluent-bit changed

- name: docker | remove Lua when not active
  ansible.builtin.file:
    path: /etc/fluent-bit/scripts/docker_events.lua
    state: absent
  when: base_stack | default([]) | intersect(['docker_events', 'freeipa']) | length == 0
  notify: fluent-bit changed
