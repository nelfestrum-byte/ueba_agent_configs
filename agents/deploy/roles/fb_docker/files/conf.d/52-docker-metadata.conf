# /etc/fluent-bit/conf.d/52-docker-metadata.conf
# Метаданные для docker Events API и osquery_json (docker_events pipeline).
# Управляется Ansible (роль fb_docker). Не редактировать вручную.

[FILTER]
    Name    record_modifier
    Match   docker_events
    Record  source_type docker_events

[FILTER]
    Name    record_modifier
    Match   osquery_json
    Record  source_type osquery
