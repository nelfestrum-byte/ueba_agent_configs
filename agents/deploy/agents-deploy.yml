---
# Развертывание UEBA-агентов: auditd + fluent-bit + osquery (Debian/Ubuntu)
#
# Стек сбора audit-событий:
#   auditd     — ядровый аудит (execve, sudo, auth, file_integrity)
#   fluent-bit — читает /var/log/audit/audit.log, объединяет события по serial
#                через Lua-скрипты, обогащает ECS-полями → Logstash TCP 5045
#                → OpenSearch индекс fluent-audit-YYYY.MM.dd
#
# Стек сбора osquery-событий:
#   osquery    — diff-мониторинг: процессы, соединения, пользователи, сервисы
#   fluent-bit — читает /var/log/osquery/osqueryd.results.log, нормализует
#                в ECS + osquery.* namespace → Logstash TCP 5047
#                → OpenSearch индекс fluent-osquery-YYYY.MM.dd
#
# Использование:
#   cd agents/deploy && ansible-playbook agents-deploy.yml --ask-become-pass
#
# Переменные: см. group_vars/all.yml (скопировать из all.yml.example)

- name: Deploy UEBA agents (auditd + fluent-bit + osquery)
  hosts: ueba_agents
  become: true
  gather_facts: true

  pre_tasks:
    - name: Assert Debian-family OS
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: >
          Плейбук использует apt; требуется Debian/Ubuntu.
          Обнаружено: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}

    - name: Создать рабочие директории
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/audit/rules.d
        - /etc/fluent-bit/scripts
        - /etc/osquery
        - /var/log/osquery
        - /var/lib/fluent-bit/storage
        - /usr/share/keyrings

  tasks:

    # ── 1. apt-репозитории (только в онлайн-режиме) ──────────────────────────

    - name: Добавить GPG ключ osquery
      ansible.builtin.get_url:
        url: "{{ osquery_apt_key_url }}"
        dest: /usr/share/keyrings/osquery-keyring.gpg
        mode: "0644"
      when: not (use_local_packages | default(false))

    - name: Добавить apt-репозиторий osquery
      ansible.builtin.apt_repository:
        repo: >
          deb [arch=amd64 signed-by=/usr/share/keyrings/osquery-keyring.gpg]
          {{ osquery_apt_repo_url }} deb main
        filename: osquery
        state: present
      when: not (use_local_packages | default(false))

    # ── 3. Установка пакетов ───────────────────────────────────────────────────

    # -- Онлайн: всё из подключённых репозиториев
    - name: Установить auditd, osquery, acl (онлайн)
      ansible.builtin.apt:
        name:
          - auditd
          - audispd-plugins
          - osquery
          - acl
        state: latest
        update_cache: true
      when: not (use_local_packages | default(false))

    # -- Офлайн: acl + auditd из Debian-репо, остальное из локальных .deb
    - name: Установить auditd, audispd-plugins, acl из системного репозитория (офлайн)
      ansible.builtin.apt:
        name:
          - auditd
          - audispd-plugins
          - acl
        state: latest
        update_cache: true
      when: use_local_packages | default(false)

    - name: Собрать факты об установленных пакетах (офлайн)
      ansible.builtin.package_facts:
        manager: apt
      when: use_local_packages | default(false)

    - name: Проверить актуальность установленных версий .deb пакетов
      ansible.builtin.set_fact:
        _debs_install_needed: >-
          {{
            (ansible_facts.packages.get('fluent-bit', [{}])[0].get('version', '') is not search('^' + fluent_bit_version))
            or (ansible_facts.packages.get('osquery', [{}])[0].get('version', '') is not search('^' + osquery_version))
          }}
      when: use_local_packages | default(false)

    - name: Скопировать локальные .deb на целевые хосты
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/tmp/{{ item }}"
        mode: "0644"
      loop:
        - "{{ fluent_bit_local_deb }}"
        - "{{ osquery_local_deb }}"
      when: (use_local_packages | default(false)) and (_debs_install_needed | default(true))

    - name: Установить fluent-bit, osquery из локальных .deb
      ansible.builtin.apt:
        deb: "/tmp/{{ item }}"
      loop:
        - "{{ fluent_bit_local_deb }}"
        - "{{ osquery_local_deb }}"
      when: (use_local_packages | default(false)) and (_debs_install_needed | default(true))

    - name: Удалить временные .deb файлы
      ansible.builtin.file:
        path: "/tmp/{{ item }}"
        state: absent
      loop:
        - "{{ fluent_bit_local_deb }}"
        - "{{ osquery_local_deb }}"
      when: (use_local_packages | default(false)) and (_debs_install_needed | default(true))

    # ── 4. auditd — конфигурация ───────────────────────────────────────────────

    - name: Настроить auditd.conf (EOE-записи, enriched format, log_group)
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backup: true
      loop:
        - { regexp: '^end_of_event_timeout\s*=', line: 'end_of_event_timeout = 2' }
        - { regexp: '^log_format\s*=',           line: 'log_format = ENRICHED' }
        - { regexp: '^log_group\s*=',            line: 'log_group = adm' }
        - { regexp: '^max_log_file\s*=',         line: 'max_log_file = 100' }
        - { regexp: '^max_log_file_action\s*=',  line: 'max_log_file_action = ROTATE' }
        - { regexp: '^num_logs\s*=',             line: 'num_logs = 5' }
        - { regexp: '^flush\s*=',                line: 'flush = INCREMENTAL_ASYNC' }
      notify: restart auditd

    - name: Развернуть правила аудита
      ansible.builtin.copy:
        src: ../configs/auditd/audit.rules
        dest: /etc/audit/rules.d/ueba.rules
        owner: root
        group: root
        mode: "0640"
      notify: reload auditd rules

    - name: Загрузить правила auditd через augenrules
      ansible.builtin.command:
        cmd: augenrules --load
      changed_when: false

    - name: Включить и запустить auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started

    # ── 5. fluent-bit — конфигурация ──────────────────────────────────────────

    - name: Развернуть fluent-bit.conf
      ansible.builtin.template:
        src: ../configs/fluent-bit/fluent-bit.conf.j2
        dest: /etc/fluent-bit/fluent-bit.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart fluent-bit

    - name: Развернуть parsers.conf
      ansible.builtin.template:
        src: ../configs/fluent-bit/parsers.conf.j2
        dest: /etc/fluent-bit/parsers.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart fluent-bit

    - name: Развернуть Lua-скрипт auditd_merge.lua
      ansible.builtin.copy:
        src: ../configs/fluent-bit/scripts/auditd_merge.lua
        dest: /etc/fluent-bit/scripts/auditd_merge.lua
        owner: root
        group: root
        mode: "0644"
      notify: restart fluent-bit

    - name: Развернуть Lua-скрипт auditd_enrich.lua
      ansible.builtin.copy:
        src: ../configs/fluent-bit/scripts/auditd_enrich.lua
        dest: /etc/fluent-bit/scripts/auditd_enrich.lua
        owner: root
        group: root
        mode: "0644"
      notify: restart fluent-bit

    - name: Развернуть Lua-скрипт osquery_enrich.lua
      ansible.builtin.copy:
        src: ../configs/fluent-bit/scripts/osquery_enrich.lua
        dest: /etc/fluent-bit/scripts/osquery_enrich.lua
        owner: root
        group: root
        mode: "0644"
      notify: restart fluent-bit

    - name: Развернуть общие Lua-утилиты proc_common.lua
      ansible.builtin.copy:
        src: ../configs/fluent-bit/scripts/proc_common.lua
        dest: /etc/fluent-bit/scripts/proc_common.lua
        owner: root
        group: root
        mode: "0644"
      notify: restart fluent-bit

    - name: Развернуть Lua-скрипт remove_commas.lua (keycloak pipeline)
      ansible.builtin.copy:
        src: ../configs/fluent-bit/scripts/remove_commas.lua
        dest: /etc/fluent-bit/scripts/remove_commas.lua
        owner: root
        group: root
        mode: "0644"
      when: "'keycloak' in base_stack | default([])"
      notify: restart fluent-bit

    - name: Развернуть Lua-скрипт freeipa.lua (freeipa pipeline)
      ansible.builtin.copy:
        src: ../configs/fluent-bit/scripts/freeipa.lua
        dest: /etc/fluent-bit/scripts/freeipa.lua
        owner: root
        group: root
        mode: "0644"
      when: "'freeipa' in base_stack | default([])"
      notify: restart fluent-bit

    - name: Развернуть Lua-скрипт docker_events.lua (docker_events pipeline)
      ansible.builtin.copy:
        src: ../configs/fluent-bit/scripts/docker_events.lua
        dest: /etc/fluent-bit/scripts/docker_events.lua
        owner: root
        group: root
        mode: "0644"
      when: >-
        'docker_events' in base_stack | default([]) or
        'freeipa' in base_stack | default([])
      notify: restart fluent-bit

    - name: Создать /etc/default/fluent-bit с переменными окружения
      ansible.builtin.template:
        src: ../configs/fluent-bit/fluent-bit.env.j2
        dest: /etc/default/fluent-bit
        owner: root
        group: root
        mode: "0640"
      notify: restart fluent-bit

    - name: Добавить fluent-bit в группу adm (чтение /var/log/audit/audit.log)
      ansible.builtin.user:
        name: fluent-bit
        groups: adm
        append: true
      notify: restart fluent-bit

    - name: Настроить ACL на каталог /var/log/audit для fluent-bit
      ansible.builtin.shell:
        cmd: |
          setfacl -m u:fluent-bit:rx /var/log/audit
          setfacl -m d:u:fluent-bit:r /var/log/audit
          [ -f /var/log/audit/audit.log ] && \
            setfacl -m u:fluent-bit:r /var/log/audit/audit.log || true
      changed_when: false

    - name: Настроить ACL на каталог /var/log/osquery для fluent-bit
      ansible.builtin.shell:
        cmd: |
          setfacl -m u:fluent-bit:rx /var/log/osquery
          setfacl -m d:u:fluent-bit:r /var/log/osquery
          [ -f /var/log/osquery/osqueryd.results.log ] && \
            setfacl -m u:fluent-bit:r /var/log/osquery/osqueryd.results.log || true
      changed_when: false

    - name: Включить и запустить fluent-bit
      ansible.builtin.systemd:
        name: fluent-bit
        enabled: true
        state: started

    # ── 6. osquery ─────────────────────────────────────────────────────────────

    - name: "[P2-01] Pre-flight: kernel version for BPF backend"
      ansible.builtin.assert:
        that:
          - ansible_kernel is version('5.10', '>=')
        fail_msg: >-
          osquery_bpf_events_enabled=true requires kernel >= 5.10
          (found: {{ ansible_kernel }}). Set osquery_bpf_events_enabled=false
          for this host or upgrade the kernel.
      when: osquery_bpf_events_enabled | default(false)
      tags: [osquery, p2_01]

    - name: "[P2-01] Pre-flight: BTF availability"
      ansible.builtin.stat:
        path: /sys/kernel/btf/vmlinux
      register: btf_stat
      when: osquery_bpf_events_enabled | default(false)
      tags: [osquery, p2_01]

    - name: "[P2-01] Fail if BTF missing"
      ansible.builtin.fail:
        msg: >-
          BTF (/sys/kernel/btf/vmlinux) is missing on this host —
          kernel built without CONFIG_DEBUG_INFO_BTF. BPF backend cannot work.
          Exclude this host from [bpf_hosts] or recompile the kernel.
      when:
        - osquery_bpf_events_enabled | default(false)
        - not btf_stat.stat.exists
      tags: [osquery, p2_01]

    - name: Render and deploy osquery config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../configs/osquery/osquery.conf.j2"
        dest: /etc/osquery/osquery.conf
        owner: root
        group: root
        mode: "0640"
        validate: 'python3 -c "import json,sys; json.load(open(sys.argv[1]))" %s'
      notify: restart osqueryd
      tags: [osquery]

    - name: Валидировать конфиг osquery
      ansible.builtin.command:
        cmd: osqueryd --config_path=/etc/osquery/osquery.conf --config_check --database_path=/tmp/osquery-configcheck
      changed_when: false

    - name: Удалить временную БД после валидации osquery
      ansible.builtin.file:
        path: /tmp/osquery-configcheck
        state: absent

    - name: Включить и запустить osqueryd
      ansible.builtin.systemd:
        name: osqueryd
        enabled: true
        state: started

  # ── Handlers ──────────────────────────────────────────────────────────────────

  handlers:
    - name: restart auditd
      ansible.builtin.command:
        cmd: service auditd restart
      changed_when: false

    - name: reload auditd rules
      ansible.builtin.command:
        cmd: augenrules --load
      changed_when: false

    - name: restart fluent-bit
      ansible.builtin.systemd:
        name: fluent-bit
        state: restarted

    - name: restart osqueryd
      ansible.builtin.systemd:
        name: osqueryd
        state: restarted
