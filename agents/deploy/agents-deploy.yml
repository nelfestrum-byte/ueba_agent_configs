---
# Развертывание UEBA-агентов: auditbeat + filebeat + osquery (Debian/Ubuntu)
#
# Стек:
#   auditbeat — заменяет auditd демон; управляет аудитом ядра через netlink
#   filebeat  — читает osquery results.log + /var/log/auth.log (sshd)
#   osquery   — остаётся как источник данных для filebeat
#
# Устаревшие пакеты (удалить вручную перед первым деплоем):
#   systemctl stop auditd fluent-bit && systemctl disable auditd fluent-bit
#   apt remove --purge auditd audispd-plugins fluent-bit -y
#   rm -rf /etc/audit /etc/fluent-bit /etc/default/fluent-bit
#   rm -rf /var/lib/fluent-bit /etc/systemd/system/fluent-bit.service.d
#   systemctl daemon-reload
#
# Использование:
#   cd agents/deploy && ansible-playbook agents-deploy.yml --ask-become-pass
#
# Переменные: см. group_vars/all.yml (скопировать из all.yml.example)

- name: Deploy UEBA agents (auditbeat + filebeat + osquery)
  hosts: ueba_agents
  become: true
  gather_facts: true

  vars_files:
    - group_vars/all.yml

  pre_tasks:
    - name: Assert Debian-family OS
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: >
          Плейбук использует apt; требуется Debian/Ubuntu.
          Обнаружено: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}

    - name: Создать рабочие директории
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/auditbeat/rules.d
        - /etc/filebeat
        - /etc/osquery
        - /var/log/osquery
        - /usr/share/keyrings

  tasks:

    # ── 1. Остановить конфликтующие сервисы ───────────────────────────────────
    # auditd и auditbeat не могут одновременно владеть audit netlink-сокетом.

    - name: Остановить auditd (конфликт с auditbeat за audit netlink)
      ansible.builtin.systemd:
        name: auditd
        state: stopped
        enabled: false
      failed_when: false

    # ── 2. apt-репозитории (только в онлайн-режиме) ───────────────────────────

    - name: Добавить GPG ключ Elastic
      ansible.builtin.shell:
        cmd: >
          curl -fsSL {{ elastic_apt_key_url }}
          | gpg --dearmor -o /usr/share/keyrings/elastic-keyring.gpg
        creates: /usr/share/keyrings/elastic-keyring.gpg
      when: not (use_local_packages | default(false))

    - name: Добавить apt-репозиторий Elastic
      ansible.builtin.apt_repository:
        repo: >
          deb [arch=amd64 signed-by=/usr/share/keyrings/elastic-keyring.gpg]
          {{ elastic_apt_repo_url }} stable main
        filename: elastic
        state: present
      when: not (use_local_packages | default(false))

    - name: Добавить GPG ключ osquery
      ansible.builtin.get_url:
        url: "{{ osquery_apt_key_url }}"
        dest: /usr/share/keyrings/osquery-keyring.gpg
        mode: "0644"
      when: not (use_local_packages | default(false))

    - name: Добавить apt-репозиторий osquery
      ansible.builtin.apt_repository:
        repo: >
          deb [arch=amd64 signed-by=/usr/share/keyrings/osquery-keyring.gpg]
          {{ osquery_apt_repo_url }} deb main
        filename: osquery
        state: present
      when: not (use_local_packages | default(false))

    # ── 3. Установка пакетов ───────────────────────────────────────────────────

    # -- Онлайн: всё из подключённых репозиториев
    - name: Установить auditbeat, filebeat, osquery, acl (онлайн)
      ansible.builtin.apt:
        name:
          - auditbeat
          - filebeat
          - osquery
          - acl
        state: latest
        update_cache: true
      when: not (use_local_packages | default(false))

    # -- Офлайн: acl из Debian-репо, остальное из локальных .deb
    - name: Установить acl из системного репозитория (офлайн)
      ansible.builtin.apt:
        name: acl
        state: latest
        update_cache: true
      when: use_local_packages | default(false)

    - name: Скопировать локальные .deb на целевые хосты
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/tmp/{{ item }}"
        mode: "0644"
      loop:
        - "{{ auditbeat_local_deb }}"
        - "{{ filebeat_local_deb }}"
        - "{{ osquery_local_deb }}"
      when: use_local_packages | default(false)

    - name: Установить auditbeat, filebeat, osquery из локальных .deb
      ansible.builtin.apt:
        deb: "/tmp/{{ item }}"
      loop:
        - "{{ auditbeat_local_deb }}"
        - "{{ filebeat_local_deb }}"
        - "{{ osquery_local_deb }}"
      when: use_local_packages | default(false)

    - name: Удалить временные .deb файлы
      ansible.builtin.file:
        path: "/tmp/{{ item }}"
        state: absent
      loop:
        - "{{ auditbeat_local_deb }}"
        - "{{ filebeat_local_deb }}"
        - "{{ osquery_local_deb }}"
      when: use_local_packages | default(false)

    # ── 4. auditbeat ──────────────────────────────────────────────────────────

    - name: Развернуть auditbeat.yml
      ansible.builtin.copy:
        src: ../configs/auditbeat/auditbeat.yml
        dest: /etc/auditbeat/auditbeat.yml
        owner: root
        group: root
        mode: "0600"
      notify: restart auditbeat

    - name: Развернуть правила аудита
      ansible.builtin.copy:
        src: ../configs/auditbeat/rules.d/ueba.conf
        dest: /etc/auditbeat/rules.d/ueba.conf
        owner: root
        group: root
        mode: "0640"
      notify: restart auditbeat

    - name: Создать keystore auditbeat
      ansible.builtin.command:
        cmd: auditbeat keystore create
        creates: /etc/auditbeat/auditbeat.keystore

    - name: Записать LOGSTASH_HOST в keystore auditbeat
      ansible.builtin.shell:
        cmd: printf '%s' "{{ logstash_host }}:5044" | auditbeat keystore add LOGSTASH_HOST --stdin --force
      changed_when: true
      no_log: true

    - name: Валидировать конфиг auditbeat
      ansible.builtin.command:
        cmd: auditbeat test config
      environment:
        LOGSTASH_HOST: "{{ logstash_host }}:5044"
      changed_when: false

    - name: Включить и запустить auditbeat
      ansible.builtin.systemd:
        name: auditbeat
        enabled: true
        state: started

    # ── 5. filebeat ───────────────────────────────────────────────────────────

    - name: Развернуть filebeat.yml
      ansible.builtin.copy:
        src: ../configs/filebeat/filebeat.yml
        dest: /etc/filebeat/filebeat.yml
        owner: root
        group: root
        mode: "0640"
      notify: restart filebeat

    - name: Создать keystore filebeat
      ansible.builtin.command:
        cmd: filebeat keystore create
        creates: /etc/filebeat/filebeat.keystore

    - name: Записать LOGSTASH_HOST в keystore filebeat
      ansible.builtin.shell:
        cmd: printf '%s' "{{ logstash_host }}:5044" | filebeat keystore add LOGSTASH_HOST --stdin --force
      changed_when: true
      no_log: true

    - name: Добавить filebeat в группу adm (доступ к /var/log/auth.log)
      ansible.builtin.user:
        name: filebeat
        groups: adm
        append: true
      notify: restart filebeat

    - name: Настроить ACL для доступа filebeat к osquery логам
      ansible.builtin.shell:
        cmd: |
          setfacl -m u:filebeat:rx /var/log/osquery
          setfacl -m d:u:filebeat:r /var/log/osquery
          [ -f /var/log/osquery/osqueryd.results.log ] && \
            setfacl -m u:filebeat:r /var/log/osquery/osqueryd.results.log || true
      changed_when: false

    - name: Валидировать конфиг filebeat
      ansible.builtin.command:
        cmd: filebeat test config
      environment:
        LOGSTASH_HOST: "{{ logstash_host }}:5044"
      changed_when: false

    - name: Включить и запустить filebeat
      ansible.builtin.systemd:
        name: filebeat
        enabled: true
        state: started

    # ── 6. osquery ─────────────────────────────────────────────────────────────

    - name: Развернуть конфиг osquery
      ansible.builtin.copy:
        src: ../configs/osquery/osquery.conf
        dest: /etc/osquery/osquery.conf
        owner: root
        group: root
        mode: "0640"
      notify: restart osqueryd

    - name: Валидировать конфиг osquery
      ansible.builtin.command:
        cmd: osqueryd --config_path=/etc/osquery/osquery.conf --config_check --database_path=/tmp/osquery-configcheck
      changed_when: false

    - name: Удалить временную БД после валидации osquery
      ansible.builtin.file:
        path: /tmp/osquery-configcheck
        state: absent

    - name: Включить и запустить osqueryd
      ansible.builtin.systemd:
        name: osqueryd
        enabled: true
        state: started

  # ── Handlers ──────────────────────────────────────────────────────────────────

  handlers:
    - name: restart auditbeat
      ansible.builtin.systemd:
        name: auditbeat
        state: restarted

    - name: restart filebeat
      ansible.builtin.systemd:
        name: filebeat
        state: restarted

    - name: restart osqueryd
      ansible.builtin.systemd:
        name: osqueryd
        state: restarted
