[FILTER]
    Name    grep
    Match   docker.*
    Regex   log .+

[FILTER]
    name                  multiline
#    multiline.parser      docker
    match                 docker.*
    multiline.key_content log
    mode                  partial_message

[FILTER]
    Name         parser
    Parser       docker
    Match        docker.*
    Key_Name     log
    Reserve_Data true
    Preserve_Key false

[FILTER]
    Name              lua
    Match             docker_events
    script            scripts/docker_events.lua
    call              sanitize_attributes

[FILTER]
    Name    modify
    Match   docker.*
    Rename  log unparsed_log

[FILTER]
    Name    record_modifier
    Match   *
    Record  fqdn ${HOSTNAME}

[FILTER]
    Name    record_modifier
    Match   docker.*
    Record  source_type docker

[FILTER]
    Name    record_modifier
    Match   docker_events
    Record  source_type docker_events

[FILTER]
    Name    record_modifier
    Match   suricata_json
    Record  source_type suricata

[FILTER]
    Name    record_modifier
    Match   waf_json
    Record  source_type modsecurity

[FILTER]
    Name    record_modifier
    Match   osquery_json
    Record  source_type osquery

