[FILTER]
    Name         parser
#    Parser       json
    Parser       docker
    Match        docker.*
    Key_Name     log
    Reserve_Data true
    Preserve_Key false

[FILTER]
    Name    modify
    Match   docker.*
    Rename  log.logger log_logger

[FILTER]
    Name    rewrite_tag
    Match   docker.*
    Rule    $log_logger "org.keycloak.events" keycloak.events false
#    Rule    $log['log.logger'] "org.keycloak.events" keycloak.events false

[FILTER]
    Name   lua
    Match  keycloak.events
    script scripts/remove_commas.lua
    call   remove_commas

[FILTER]
    Name         parser
    Parser       logfmt
    Match        keycloak.events
    Key_Name     message
    Reserve_Data true
    Preserve_Key false

[FILTER]
    Name    modify
    Match   keycloak.events
    Rename  log_logger logger

#[FILTER]
#    Name    rewrite_tag
#    Match   keycloak.events
#    Rule    $log['log.logger'] "org.keycloak.events" docker.keycloak_events false

[FILTER]
    Name    rewrite_tag
    Match   keycloak.events
    Rule    $logger "org.keycloak.events" docker.keycloak_events false

[FILTER]
    Name    modify
    Match   docker.*
    Rename  log unparsed_log

[FILTER]
    Name    record_modifier
    Match   *
    Record  fqdn ${HOSTNAME}

[FILTER]
    Name    record_modifier
    Match   docker.*
    Record  source_type docker

#[OUTPUT]
