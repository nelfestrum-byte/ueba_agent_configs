{
  "options": {
    "config_plugin": "filesystem",
    "logger_plugin": "filesystem",
    "logger_path": "/var/log/osquery",
    "disable_logging": "false",
    "log_result_events": "true",
    "schedule_splay_percent": "10",
    "utc": "true",
    "host_identifier": "hostname",
    "enable_monitor": "true",
    "disable_events": "false"
  },
  "schedule": {

    "processes_snapshot": {
      "query": "SELECT count(*) AS value, 'processes_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM processes",
      "interval": 30,
      "snapshot": true
    },

    "listening_ports_snapshot": {
      "query": "SELECT count(*) AS value, 'listening_ports_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM listening_ports",
      "interval": 30,
      "snapshot": true
    },

    "open_sockets_snapshot": {
      "query": "SELECT count(*) AS value, 'open_sockets_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM process_open_sockets WHERE family IN (2, 10)",
      "interval": 30,
      "snapshot": true
    },

    "kernel_modules_snapshot": {
      "query": "SELECT count(*) AS value, 'kernel_modules_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM kernel_modules",
      "interval": 60,
      "snapshot": true
    },

    "users_snapshot": {
      "query": "SELECT count(*) AS value, 'users_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM users",
      "interval": 120,
      "snapshot": true
    },

    "routes_snapshot": {
      "query": "SELECT count(*) AS value, 'routes_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM routes",
      "interval": 60,
      "snapshot": true
    },

    "crontab_snapshot": {
      "query": "SELECT count(*) AS value, 'cronjobs_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM crontab",
      "interval": 60,
      "snapshot": true
    },

    "logged_in_users_snapshot": {
      "query": "SELECT count(*) AS value, 'logged_in_users_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM logged_in_users",
      "interval": 30,
      "snapshot": true
    },

    "ssh_keys_snapshot": {
      "query": "SELECT count(*) AS value, 'ssh_authorized_keys_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM authorized_keys",
      "interval": 60,
      "snapshot": true
    },

    "new_listening_ports": {
      "query": "SELECT p.name AS process_name, l.port, l.protocol, l.address, (SELECT hostname FROM system_info) AS hostname FROM listening_ports l LEFT JOIN processes p ON l.pid = p.pid",
      "interval": 60
    },

    "new_processes": {
      "query": "SELECT p.pid, p.name, p.path, p.cmdline, p.uid, p.parent, (SELECT hostname FROM system_info) AS hostname FROM processes p WHERE p.path NOT LIKE '/usr/%' AND p.path NOT LIKE '/bin/%' AND p.path NOT LIKE '/sbin/%' AND p.path != '' AND p.path IS NOT NULL",
      "interval": 30
    },

    "new_users": {
      "query": "SELECT uid, username, description, directory, shell, (SELECT hostname FROM system_info) AS hostname FROM users",
      "interval": 120
    },

    "new_crontabs": {
      "query": "SELECT command, path, minute, hour, day_of_month, month, day_of_week, (SELECT hostname FROM system_info) AS hostname FROM crontab",
      "interval": 60
    },

    "new_ssh_keys": {
      "query": "SELECT authorized_keys.uid, authorized_keys.key, authorized_keys.key_file, users.username, (SELECT hostname FROM system_info) AS hostname FROM authorized_keys JOIN users USING(uid)",
      "interval": 60
    },

    "new_kernel_modules": {
      "query": "SELECT name, size, status, address, (SELECT hostname FROM system_info) AS hostname FROM kernel_modules",
      "interval": 60
    },

    "services_snapshot": {
      "query": "SELECT count(*) AS value, 'services_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM services",
      "interval": 60,
      "snapshot": true
    },

    "startup_items_snapshot": {
      "query": "SELECT count(*) AS value, 'startup_items_count' AS metric_name, (SELECT hostname FROM system_info) AS entity_id, 'host' AS entity_type FROM startup_items",
      "interval": 120,
      "snapshot": true
    },

    "new_services": {
      "query": "SELECT name, status, start_type, path, (SELECT hostname FROM system_info) AS hostname FROM services",
      "interval": 60
    }
  }
}
