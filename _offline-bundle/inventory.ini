; Пример inventory. Адаптируйте под свою среду.
;
; Если sudo требует пароль — раскомментируйте ansible_become_pass или
; запускайте плейбук с --ask-become-pass.

[ueba_agents]
; agent01.example.local ansible_host=10.0.0.11
; agent02.example.local ansible_host=10.0.0.12

[ueba_agents:vars]
ansible_user=deploy
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
; ansible_become_pass=...
