[PARSER]
    Name        json
    Format      json
    Time_Key    unixTime
    Time_Format %s
    Time_Keep   On

[PARSER]
    Name        syslog_rfc3164
    Format      regex
    Regex       ^\<(?<pri>[0-9]+)\>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<MESSAGE>.*)$
    Time_Key    time
    Time_Format %b %d %H:%M:%S
    Time_Keep   On

# Для /var/log/auth.log — rsyslog ISO 8601: "TIMESTAMP HOST PROGRAM[PID]: MESSAGE"
[PARSER]
    Name        syslog_no_pri
    Format      regex
    Regex       ^(?<time>\S+)\s+(?<host>\S+)\s+(?<ident>\S+):\s+(?<MESSAGE>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S
    Time_Keep   On
