[SERVICE]
    Flush           5
    Log_Level       info
    Log_File        /var/log/fluent-bit/fluent-bit.log
    Parsers_File    /etc/fluent-bit/parsers.conf
    storage.metrics On

# ── osquery snapshot метрики (osquery пишет snapshot в отдельный файл) ────────
[INPUT]
    Name              tail
    Tag               osquery.snapshot
    Path              /var/log/osquery/osqueryd.snapshots.log
    Parser            json
    DB                /var/lib/fluent-bit/osquery-snapshot.db
    Refresh_Interval  5
    Read_from_Head    false
    Skip_Empty_Lines  On

# ── osquery diff события ──────────────────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               osquery.diff
    Path              /var/log/osquery/osqueryd.results.log
    Parser            json
    DB                /var/lib/fluent-bit/osquery-diff.db
    Refresh_Interval  5
    Read_from_Head    false
    Skip_Empty_Lines  On

# ── auditd — читаем напрямую из файла (journald недоступен в Docker) ──────────
[INPUT]
    Name              tail
    Tag               auditd
    Path              /var/log/audit/audit.log
    Key               MESSAGE
    DB                /var/lib/fluent-bit/auditd.db
    Refresh_Interval  5
    Read_from_Head    false
    Skip_Empty_Lines  On

# ── sshd через /var/log/auth.log (rsyslog пишет его в контейнере) ─────────────
[INPUT]
    Name              tail
    Tag               sshd
    Path              /var/log/auth.log
    Parser            syslog_no_pri
    DB                /var/lib/fluent-bit/auth.db
    Refresh_Interval  5
    Read_from_Head    false
    Skip_Empty_Lines  On

# ── FILTERS ───────────────────────────────────────────────────────────────────

# Разворачиваем snapshot osquery в плоские документы
[FILTER]
    Name    lua
    Match   osquery.snapshot
    script  /etc/fluent-bit/flatten.lua
    call    flatten_snapshot

# Разворачиваем diff osquery
[FILTER]
    Name    lua
    Match   osquery.diff
    script  /etc/fluent-bit/flatten.lua
    call    flatten_diff

# Добавляем hostname ко всем событиям
[FILTER]
    Name    record_modifier
    Match   *
    Record  hostname ${HOSTNAME}

# Для auditd — оставляем только нужные типы событий
[FILTER]
    Name    grep
    Match   auditd
    Regex   MESSAGE (type=SYSCALL|type=USER_AUTH|type=USER_LOGIN|type=USER_START|type=USER_END)

# ── OUTPUTS ───────────────────────────────────────────────────────────────────

# osquery snapshot → Logstash порт 5048
[OUTPUT]
    Name        tcp
    Match       osquery.snapshot
    Host        ${LOGSTASH_HOST}
    Port        5048
    Format      json_lines
    Retry_Limit 3

# osquery diff → Logstash порт 5048
[OUTPUT]
    Name        tcp
    Match       osquery.diff
    Host        ${LOGSTASH_HOST}
    Port        5048
    Format      json_lines
    Retry_Limit 3

# auditd → Logstash порт 5045
[OUTPUT]
    Name        tcp
    Match       auditd
    Host        ${LOGSTASH_HOST}
    Port        5045
    Format      json_lines
    Retry_Limit 3

# sshd → Logstash порт 5047
[OUTPUT]
    Name        tcp
    Match       sshd
    Host        ${LOGSTASH_HOST}
    Port        5047
    Format      json_lines
    Retry_Limit 3
