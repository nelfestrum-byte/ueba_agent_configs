# =============================================================================
# eltex.conf
#
# UDP  5140: Eltex syslog → data-eltex-logs
# SNMP poll: Eltex interface utilization → data-eltex-snmp
#
# Требует плагин logstash-input-snmp (установлен через Dockerfile).
# MIB-файлы (.dic) → ./mibs/ → монтируется в /usr/share/logstash/mibs/
#
# SNMP hosts (192.168.1.1, 192.168.1.2) — скорректируйте под вашу сеть.
# =============================================================================

input {
  udp {
    id    => "eltex_udp"
    port  => 5140
    codec => "plain"
    type  => "eltex"
    tags  => ["eltex"]
  }

  snmp {
    id       => "eltex_snmp_utilization"
    type     => "eltex_snmp_utilization"
    interval => 300
    tables   => [{"name" => "interfaces" "columns" => [
      "1.3.6.1.4.1.35265.1.23.43.2.1.4",
      "1.3.6.1.4.1.35265.1.23.43.2.1.6",
      "1.3.6.1.4.1.35265.1.23.43.2.1.8",
      "1.3.6.1.4.1.35265.1.23.43.2.1.10"
    ]}]
    get      => ["1.3.6.1.2.1.1.1.0"]
    hosts    => [
      {host => "udp:192.168.1.1/161"},
      {host => "udp:192.168.1.2/161"}
    ]
    mib_paths => ["/usr/share/logstash/mibs/"]
  }
}

filter {
  if [type] == "eltex" {
    grok {
      patterns_dir      => ["/usr/share/logstash/patterns"]
      add_field         => [ "received@", "%{@timestamp}" ]
      id                => "eltex_grok_1"
      tag_on_failure    => "_grokparsefailure_eltex_1"
      match             => [ "message", "%{ELTXSYSLOG}" ]
    }

    syslog_pri {
      id => "eltex_syslog_pri"
    }

    date {
      match          => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
      id             => "eltex_date"
      tag_on_failure => "_date_filter_failure_eltex"
    }

    if "_grokparsefailure_eltex_1" not in [tags] {
      mutate {
        id           => "eltex_mutate"
        replace      => [ "message", "%{syslog_message}" ]
        remove_field => [ "syslog_pri", "syslog_message" ]
      }
      grok {
        id            => "eltex_grok_2"
        patterns_dir  => ["/usr/share/logstash/patterns"]
        match         => ["message", "%{MIKROTIKMSGS}"]
        add_tag       => "eltex finally grokked"
        tag_on_failure => "_grokparsefailure_eltex_2"
      }
    }
  }

  if [type] == "eltex_snmp_utilization" {
    split {
      field => "interfaces"
      id    => "eltex_snmp_utilization_split"
    }
    mutate {
      id     => "eltex_snmp_utilization_mutate"
      rename => {
        "[iso.org.dod.internet.mgmt.mib-2.system.sysDescr.0]"                                                                                              => "model"
        "[interfaces][index]"                                                                                                                               => "interface"
        "[interfaces][iso.org.dod.internet.private.enterprises.35265.1.eltMes.eltMesSwInterfaces.2.1.4]"  => "input_rate_Kbit/s"
        "[interfaces][iso.org.dod.internet.private.enterprises.35265.1.eltMes.eltMesSwInterfaces.2.1.6]"  => "output_rate_Kbit/s"
        "[interfaces][iso.org.dod.internet.private.enterprises.35265.1.eltMes.eltMesSwInterfaces.2.1.8]"  => "avg_input_rate_Kbit/s"
        "[interfaces][iso.org.dod.internet.private.enterprises.35265.1.eltMes.eltMesSwInterfaces.2.1.10]" => "avg_output_rate_Kbit/s"
      }
      convert => {
        "interface"           => "integer"
        "input_rate_Kbit/s"   => "float"
        "output_rate_Kbit/s"  => "float"
        "avg_input_rate_Kbit/s"  => "float"
        "avg_output_rate_Kbit/s" => "float"
      }
    }
    if [interface] >= 49 and [interface] <= 96 {
      ruby { code => "event.set('interface', event.get('interface') - 48)" }
      mutate { replace => { "interface" => "gigabitethernet 1/0/%{interface}" } }
    } else if [interface] >= 157 and [interface] <= 204 {
      ruby { code => "event.set('interface', event.get('interface') - 156)" }
      mutate { replace => { "interface" => "gigabitethernet 2/0/%{interface}" } }
    } else if [interface] >= 256 and [interface] <= 303 {
      ruby { code => "event.set('interface', event.get('interface') - 255)" }
      mutate { replace => { "interface" => "gigabitethernet 3/0/%{interface}" } }
    } else if [interface] >= 373 and [interface] <= 420 {
      ruby { code => "event.set('interface', event.get('interface') - 372)" }
      mutate { replace => { "interface" => "gigabitethernet 4/0/%{interface}" } }
    } else if [interface] >= 481 and [interface] <= 528 {
      ruby { code => "event.set('interface', event.get('interface') - 480)" }
      mutate { replace => { "interface" => "gigabitethernet 5/0/%{interface}" } }
    } else if [interface] >= 589 and [interface] <= 636 {
      ruby { code => "event.set('interface', event.get('interface') - 588)" }
      mutate { replace => { "interface" => "gigabitethernet 6/0/%{interface}" } }
    } else if [interface] >= 697 and [interface] <= 744 {
      ruby { code => "event.set('interface', event.get('interface') - 696)" }
      mutate { replace => { "interface" => "gigabitethernet 7/0/%{interface}" } }
    } else if [interface] >= 805 and [interface] <= 852 {
      ruby { code => "event.set('interface', event.get('interface') - 804)" }
      mutate { replace => { "interface" => "gigabitethernet 8/0/%{interface}" } }
    } else if [interface] >= 105 and [interface] <= 108 {
      ruby { code => "event.set('interface', event.get('interface') - 104)" }
      mutate { replace => { "interface" => "tengigabitethernet 1/0/%{interface}" } }
    } else if [interface] >= 213 and [interface] <= 216 {
      ruby { code => "event.set('interface', event.get('interface') - 212)" }
      mutate { replace => { "interface" => "tengigabitethernet 2/0/%{interface}" } }
    } else if [interface] >= 321 and [interface] <= 324 {
      ruby { code => "event.set('interface', event.get('interface') - 320)" }
      mutate { replace => { "interface" => "tengigabitethernet 3/0/%{interface}" } }
    } else if [interface] >= 429 and [interface] <= 432 {
      ruby { code => "event.set('interface', event.get('interface') - 428)" }
      mutate { replace => { "interface" => "tengigabitethernet 4/0/%{interface}" } }
    } else if [interface] >= 537 and [interface] <= 540 {
      ruby { code => "event.set('interface', event.get('interface') - 536)" }
      mutate { replace => { "interface" => "tengigabitethernet 5/0/%{interface}" } }
    } else if [interface] >= 645 and [interface] <= 648 {
      ruby { code => "event.set('interface', event.get('interface') - 644)" }
      mutate { replace => { "interface" => "tengigabitethernet 6/0/%{interface}" } }
    } else if [interface] >= 753 and [interface] <= 756 {
      ruby { code => "event.set('interface', event.get('interface') - 752)" }
      mutate { replace => { "interface" => "tengigabitethernet 7/0/%{interface}" } }
    } else if [interface] >= 861 and [interface] <= 864 {
      ruby { code => "event.set('interface', event.get('interface') - 860)" }
      mutate { replace => { "interface" => "tengigabitethernet 8/0/%{interface}" } }
    } else if [interface] >= 1000 and [interface] <= 1047 {
      ruby { code => "event.set('interface', event.get('interface') - 999)" }
      mutate { replace => { "interface" => "Port-Channel 1/0/%{interface}" } }
    } else if [interface] >= 100000 and [interface] <= 104095 {
      ruby { code => "event.set('interface', event.get('interface') - 99999)" }
      mutate { replace => { "interface" => "VLAN %{interface}" } }
    }
  }
}

output {
  if [type] == "eltex" {
    opensearch {
      id                          => "eltex_opensearch"
      hosts                       => ["${OPENSEARCH_URL:http://localhost:9200}"]
      user                        => "${OPENSEARCH_USER:}"
      password                    => "${OPENSEARCH_PASSWORD:}"
      ssl                         => "${OPENSEARCH_SSL:false}"
      ssl_certificate_verification => "${OPENSEARCH_SSL_VERIFY:false}"
      cacert                      => "${OPENSEARCH_CA_CERT:}"
      index                       => "data-eltex-logs"
      action                      => "create"
    }
  }

  if [type] == "eltex_snmp_utilization" {
    opensearch {
      id                          => "eltex_snmp_utilization_opensearch"
      hosts                       => ["${OPENSEARCH_URL:http://localhost:9200}"]
      user                        => "${OPENSEARCH_USER:}"
      password                    => "${OPENSEARCH_PASSWORD:}"
      ssl                         => "${OPENSEARCH_SSL:false}"
      ssl_certificate_verification => "${OPENSEARCH_SSL_VERIFY:false}"
      cacert                      => "${OPENSEARCH_CA_CERT:}"
      index                       => "data-eltex-snmp"
      action                      => "create"
    }
  }
}
