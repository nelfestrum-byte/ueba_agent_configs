# =============================================================================
# data-ingest.conf
#
# TCP  5044: JSON-события от fluent-bit (client stack) → data_%{source_type}
# UDP  5514: generic syslog                            → logs-general-YYYY_MM_dd
# =============================================================================

input {
  tcp {
    port => 5044
  }
  udp {
    port => 5514
  }
}

filter {
  if [message] =~ /^\{.*/ {
    json { source => "message" }
  }

  if [source_type] {
    mutate {
      add_field => { "[@metadata][target_index]" => "data_%{source_type}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][target_index]" => "logs-general-%{+YYYY_MM_dd}" }
    }
  }

  mutate {
    lowercase => ["[@metadata][target_index]"]
  }
}

output {
  opensearch {
    hosts                        => ["${OPENSEARCH_URL:http://localhost:9200}"]
    user                         => "${OPENSEARCH_USER:}"
    password                     => "${OPENSEARCH_PASSWORD:}"
    ssl                          => "${OPENSEARCH_SSL:false}"
    ssl_certificate_verification => "${OPENSEARCH_SSL_VERIFY:false}"
    cacert                       => "${OPENSEARCH_CA_CERT:}"
    index                        => "%{[@metadata][target_index]}"
    action                       => "create"
    ecs_compatibility            => "disabled"
  }
}
