# =============================================================================
# ueba-main.conf — единый нормализующий пайплайн
# Источники: osquery (TCP 5048), auditd/sshd (TCP 5045/5047), suricata (TCP 5049)
# Выход: OpenSearch индексы по типу события
# =============================================================================

input {

  # osquery results (snapshot + diff) от fluent-bit
  tcp {
    port  => 5048
    codec => json_lines
    tags  => ["osquery"]
  }

  # auditd события от fluent-bit systemd
  tcp {
    port  => 5045
    codec => json_lines
    tags  => ["auditd"]
  }

  # sshd события от fluent-bit systemd
  tcp {
    port  => 5047
    codec => json_lines
    tags  => ["sshd"]
  }

  # Suricata NetFlow / alerts
  tcp {
    port  => 5049
    codec => json_lines
    tags  => ["suricata"]
  }

  # Windows winevtlog (для будущего расширения)
  tcp {
    port  => 5046
    codec => json_lines
    tags  => ["winevtlog"]
  }
}

# =============================================================================
# FILTER — парсинг и нормализация
# =============================================================================
filter {

  # ==========================================================================
  # OSQUERY — snapshot метрики и diff события
  # flatten.lua в fluent-bit уже преобразовал данные:
  #   snapshot: { metric_name, value, entity_id, entity_type, query_name, action="snapshot" }
  #   diff:     { <columns_fields>, query_name, entity_id, action="added"|"removed" }
  # ==========================================================================
  if "osquery" in [tags] {

    # Snapshot: метрики для AD детекторов
    if [action] == "snapshot" {
      mutate {
        add_field => {
          "[event][kind]"      => "metric"
          "[event][category]"  => "metric"
          "[ueba][source]"     => "osquery"
        }
      }
      mutate {
        copy => {
          "entity_id"   => "[ueba][entity_id]"
          "entity_type" => "[ueba][entity_type]"
        }
        convert => { "value" => "float" }
      }
      ruby { code => 'event.tag("osquery_metric")' }
    }

    # Diff: added/removed — flatten_diff уже разложил columns в top-level поля
    if [action] in ["added", "removed"] {
      ruby {
        code => '
          qname    = event.get("query_name") || event.get("name") || ""
          hostname = event.get("entity_id")  || event.get("hostname") || "unknown"

          action_map = {
            "new_listening_ports" => "port_change",
            "new_processes"       => "process_start",
            "new_services"        => "service_change",
            "new_scheduled_tasks" => "task_change",
            "new_users"           => "user_change",
            "new_crontabs"        => "cron_change",
            "new_ssh_keys"        => "ssh_key_change",
            "new_kernel_modules"  => "module_change"
          }
          cat_map = {
            "new_listening_ports" => "network",
            "new_processes"       => "process",
            "new_services"        => "configuration",
            "new_scheduled_tasks" => "configuration",
            "new_users"           => "iam",
            "new_crontabs"        => "configuration",
            "new_ssh_keys"        => "configuration",
            "new_kernel_modules"  => "configuration"
          }

          event.set("diff_action",         event.get("action"))
          event.set("entity_id",           hostname)
          event.set("entity_type",         "host")
          event.set("source",              "osquery")
          event.set("[event][kind]",       "event")
          event.set("[event][action]",     action_map[qname] || qname)
          event.set("[event][category]",   cat_map[qname]    || "configuration")
          event.set("[ueba][entity_id]",   hostname)
          event.set("[ueba][entity_type]", "host")
          event.set("[ueba][source]",      "osquery")
          event.tag("osquery_diff")
        '
      }
    }
  }

  # ==========================================================================
  # AUDITD — системные вызовы Linux
  # ==========================================================================
  if "auditd" in [tags] {

    # Парсим сырую строку из journald MESSAGE
    if [MESSAGE] {
      grok {
        match => {
          "MESSAGE" => "type=%{WORD:[auditd][type]} msg=audit\(%{NUMBER:[auditd][epoch]}:%{NUMBER:[auditd][seq]}\): %{GREEDYDATA:[auditd][body]}"
        }
        tag_on_failure => ["_auditd_header_fail"]
      }
    }

    # SYSCALL execve → process_start
    if [auditd][type] == "SYSCALL" {
      grok {
        match => {
          "[auditd][body]" => [
            "arch=%{DATA} syscall=%{NUMBER:[auditd][syscall_num]} success=%{WORD:[auditd][success]} exit=%{INT:[auditd][exit_code]} %{DATA} ppid=%{INT:[auditd][ppid]} pid=%{INT:[auditd][pid]} auid=%{INT:[auditd][auid]} uid=%{INT:[auditd][uid]} gid=%{INT:[auditd][gid]} %{DATA} comm=\"%{DATA:[auditd][comm]}\" exe=\"%{DATA:[auditd][exe]}\"%{GREEDYDATA}"
          ]
        }
        tag_on_failure => ["_auditd_syscall_fail"]
      }

      if [auditd][syscall_num] == "59" {
        # execve — запуск процесса
        mutate {
          add_field => {
            "[event][kind]"         => "event"
            "[event][category]"     => "process"
            "[event][action]"       => "process_start"
            "[host][os][type]"      => "linux"
            "[process][executable]" => "%{[auditd][exe]}"
            "[process][name]"       => "%{[auditd][comm]}"
            "[ueba][source]"        => "auditd"
          }
        }
        if [auditd][success] == "yes" {
          mutate { add_field => { "[event][outcome]" => "success" } }
        } else {
          mutate { add_field => { "[event][outcome]" => "failure" } }
        }
        mutate {
          convert => {
            "[auditd][pid]"  => "integer"
            "[auditd][ppid]" => "integer"
            "[auditd][uid]"  => "integer"
            "[auditd][auid]" => "integer"
          }
        }
        mutate {
          rename => {
            "[auditd][pid]"  => "[process][pid]"
            "[auditd][ppid]" => "[process][parent][pid]"
            "[auditd][uid]"  => "[user][id]"
            "[auditd][auid]" => "[user][audit_id]"
          }
        }
      }
    }

    # USER_AUTH / USER_LOGIN → authentication
    if [auditd][type] in ["USER_AUTH", "USER_LOGIN", "USER_START", "USER_END"] {
      grok {
        match => {
          "[auditd][body]" => [
            "pid=%{INT:[auditd][pid]} uid=%{INT:[auditd][uid]} auid=%{INT:[auditd][auid]} ses=%{INT:[auditd][ses]} %{DATA}acct=\"%{DATA:[auditd][acct]}\" exe=\"%{DATA:[auditd][exe]}\" hostname=%{DATA:[auditd][hostname]} addr=(%{IP:[auditd][addr]}|\\?) terminal=%{DATA:[auditd][terminal]} res=%{WORD:[auditd][res]}"
          ]
        }
        tag_on_failure => ["_auditd_userauth_fail"]
      }

      mutate {
        add_field => {
          "[event][kind]"     => "event"
          "[event][category]" => "authentication"
          "[host][os][type]"  => "linux"
          "[ueba][source]"    => "auditd"
        }
      }

      if [auditd][res] == "success" {
        mutate { add_field => { "[event][action]" => "login" "[event][outcome]" => "success" } }
      } else {
        mutate { add_field => { "[event][action]" => "login_failed" "[event][outcome]" => "failure" } }
      }

      mutate {
        rename => {
          "[auditd][acct]"     => "[user][name]"
          "[auditd][addr]"     => "[source][ip]"
          "[auditd][hostname]" => "[source][domain]"
        }
      }
    }

    # Устанавливаем entity_id из hostname контейнера
    if ![ueba][entity_id] {
      mutate {
        add_field => {
          "[ueba][entity_id]"   => "%{[hostname]}"
          "[ueba][entity_type]" => "host"
        }
      }
    }
  }

  # ==========================================================================
  # SSHD — логины через journald
  # ==========================================================================
  if "sshd" in [tags] {

    # syslog_no_pri парсер кладёт host как строку; убираем — ниже ставим [host][os][type] объектом
    mutate { remove_field => ["host"] }

    grok {
      match => {
        "MESSAGE" => [
          "Accepted %{WORD:[sshd][auth_method]} for %{DATA:[sshd][user]} from %{IP:[sshd][src_ip]} port %{INT:[sshd][src_port]}",
          "Failed %{WORD:[sshd][auth_method]} for %{DATA:[sshd][user]} from %{IP:[sshd][src_ip]} port %{INT:[sshd][src_port]}",
          "Failed %{WORD:[sshd][auth_method]} for invalid user %{DATA:[sshd][user]} from %{IP:[sshd][src_ip]} port %{INT:[sshd][src_port]}",
          "Invalid user %{DATA:[sshd][user]} from %{IP:[sshd][src_ip]} port %{INT:[sshd][src_port]}",
          "Disconnected from %{IP:[sshd][src_ip]} port %{INT:[sshd][src_port]}",
          "session %{WORD:[sshd][session_action]} for user %{DATA:[sshd][user]}"
        ]
      }
      tag_on_failure => ["_sshd_parse_fail"]
    }

    mutate {
      add_field => {
        "[event][kind]"     => "event"
        "[event][category]" => "authentication"
        "[host][os][type]"  => "linux"
        "[ueba][source]"    => "sshd"
      }
    }

    if [MESSAGE] =~ /^Accepted/ {
      mutate { add_field => { "[event][action]" => "login" "[event][outcome]" => "success" } }
    } else if [MESSAGE] =~ /Failed|Invalid user/ {
      mutate { add_field => { "[event][action]" => "login_failed" "[event][outcome]" => "failure" } }
    }

    if [sshd][user]   { mutate { rename => { "[sshd][user]"    => "[user][name]" } } }
    if [sshd][src_ip] { mutate { rename => { "[sshd][src_ip]"  => "[source][ip]" } } }
    mutate { convert => { "[sshd][src_port]" => "integer" } }
    mutate { rename => { "[sshd][src_port]" => "[source][port]" } }

    mutate {
      add_field => {
        "[ueba][entity_id]"   => "%{[hostname]}"
        "[ueba][entity_type]" => "host"
      }
    }
  }

  # ==========================================================================
  # SURICATA — сетевые события
  # ==========================================================================
  if "suricata" in [tags] {

    if [event_type] == "flow" or [event_type] == "netflow" {
      mutate {
        add_field => {
          "[event][kind]"     => "event"
          "[event][category]" => "network"
          "[event][action]"   => "network_flow"
          "[ueba][source]"    => "suricata"
        }
      }
      mutate {
        rename => {
          "src_ip"   => "[source][ip]"
          "src_port" => "[source][port]"
          "dest_ip"  => "[destination][ip]"
          "dest_port"=> "[destination][port]"
          "proto"    => "[network][transport]"
        }
      }
    }

    if [event_type] == "alert" {
      mutate {
        add_field => {
          "[event][kind]"     => "alert"
          "[event][category]" => "network"
          "[event][action]"   => "ids_alert"
          "[ueba][source]"    => "suricata"
        }
      }
      mutate {
        rename => {
          "src_ip"          => "[source][ip]"
          "dest_ip"         => "[destination][ip]"
          "dest_port"       => "[destination][port]"
          "alert.signature" => "[rule][name]"
          "alert.severity"  => "[event][severity]"
        }
      }
    }
  }

  # ==========================================================================
  # WINEVTLOG (Windows — будущее расширение)
  # ==========================================================================
  if "winevtlog" in [tags] {
    mutate { add_field => { "[host][os][type]" => "windows" "[ueba][source]" => "winevtlog" } }
    # Нормализация добавляется при подключении Windows агента
  }

  # ==========================================================================
  # ОБЩЕЕ ОБОГАЩЕНИЕ — для всех событий
  # ==========================================================================

  # entity_id fallback — если ещё не установлен
  if ![ueba][entity_id] {
    if [host][name] {
      mutate { add_field => { "[ueba][entity_id]" => "%{[host][name]}" "[ueba][entity_type]" => "host" } }
    } else {
      mutate { add_field => { "[ueba][entity_id]" => "unknown" "[ueba][entity_type]" => "host" } }
    }
  }

  # process.name из executable (basename)
  if [process][executable] and ![process][name] {
    ruby {
      code => '
        exe = event.get("[process][executable]") || ""
        event.set("[process][name]", File.basename(exe.gsub("\\\\", "/")))
      '
    }
  }

  # Флаг подозрительного пути
  if [process][executable] {
    ruby {
      code => '
        exe = event.get("[process][executable]") || ""
        suspicious = ["/tmp/", "/dev/shm/", "/var/tmp/", "/run/user/", "AppData/", "Temp/"]
        event.set("[process][from_suspicious_path]", suspicious.any? { |p| exe.include?(p) })
      '
    }
  }

  # Время суток для auth событий
  if [event][category] == "authentication" {
    ruby {
      code => '
        ts = event.get("@timestamp")
        if ts
          h = ts.time.hour
          w = ts.time.wday
          event.set("[event][hour_of_day]",  h)
          event.set("[event][day_of_week]",  w)
          event.set("[event][is_offhours]",  h < 6 || h >= 22 || w == 0 || w == 6)
        end
      '
    }
  }

  # Маршрутизация на индекс — определяем здесь, чтобы output был один
  if "osquery_metric" in [tags] {
    mutate { add_field => { "[@metadata][index]" => "host-metrics" } }
  } else if [event][category] == "process" {
    mutate { add_field => { "[@metadata][index]" => "process-events" } }
  } else if [ueba][source] == "suricata" {
    mutate { add_field => { "[@metadata][index]" => "network-events" } }
  } else if [event][category] in ["configuration", "iam", "network"] or "osquery_diff" in [tags] {
    mutate { add_field => { "[@metadata][index]" => "config-events" } }
  } else if [event][category] == "authentication" {
    mutate { add_field => { "[@metadata][index]" => "auth-events" } }
  } else {
    mutate { add_field => { "[@metadata][index]" => "ueba-other" } }
  }

  # Очистка
  mutate {
    remove_field => ["auditd", "sshd", "MESSAGE", "HOSTNAME",
                     "PRIORITY", "_TRANSPORT", "_SYSTEMD_UNIT",
                     "SYSLOG_IDENTIFIER"]
  }
}

# =============================================================================
# OUTPUT — единая точка отправки в OpenSearch (индекс через [@metadata][index])
# =============================================================================
output {
  opensearch {
    hosts                        => ["${OPENSEARCH_URL}"]
    user                         => "${OPENSEARCH_USER}"
    password                     => "${OPENSEARCH_PASSWORD}"
    ssl                          => true
    ssl_certificate_verification => true
    cacert                       => "${OPENSEARCH_CA_CERT}"
    index                        => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
    ecs_compatibility            => "disabled"
  }
  # Отладка — раскомментировать при необходимости
  # stdout { codec => rubydebug { metadata => false } }
}
