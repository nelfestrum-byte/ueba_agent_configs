# =============================================================================
# ueba-main.conf — нормализующий пайплайн (ECS)
#
# Beats  5044: auditbeat (auditd, file_integrity) + filebeat (osquery, system/auth)
# TCP    5049: Suricata eve.json
# TCP    5046: Windows winevtlog (stub)
# =============================================================================

input {

  beats {
    port => 5044
  }

  # Suricata NetFlow / alerts
  tcp {
    port  => 5049
    codec => json_lines
    tags  => ["suricata"]
  }

  # Windows winevtlog (stub для будущего расширения)
  tcp {
    port  => 5046
    codec => json_lines
    tags  => ["winevtlog"]
  }
}

# =============================================================================
# FILTER
# =============================================================================
filter {

  # ===========================================================================
  # AUDITBEAT — auditd module
  # ECS нормализован auditbeat: process.*, user.*, event.category/action/outcome
  # event.category — массив; роутинг через "value" in [event][category]
  # ===========================================================================
  if [agent][type] == "auditbeat" and [event][module] == "auditd" {

    mutate { add_field => { "[host][os][type]" => "linux" } }

    if "process" in [event][category] {
      mutate { add_field => { "[@metadata][index]" => "process-events" } }
    } else if "authentication" in [event][category] {
      mutate { add_field => { "[@metadata][index]" => "auth-events" } }
    } else if "file" in [event][category] or "configuration" in [event][category] {
      mutate { add_field => { "[@metadata][index]" => "config-events" } }
    } else if "network" in [event][category] {
      mutate { add_field => { "[@metadata][index]" => "network-events" } }
    }
  }

  # ===========================================================================
  # AUDITBEAT — file_integrity module
  # ECS: file.path, file.hash.sha256, event.action (created/updated/deleted/…)
  # ===========================================================================
  if [agent][type] == "auditbeat" and [event][module] == "file_integrity" {
    mutate {
      add_field => {
        "[host][os][type]"   => "linux"
        "[@metadata][index]" => "config-events"
      }
    }
  }

  # ===========================================================================
  # FILEBEAT — osquery module
  # osquery.result.name    — имя запроса
  # osquery.result.action  — added / removed
  # osquery.result.columns.* — поля строки таблицы (log_result_events=true)
  # ===========================================================================
  if [agent][type] == "filebeat" and [event][module] == "osquery" {

    mutate { add_field => { "[host][os][type]" => "linux" } }

    # ── new_processes → process-events ─────────────────────────────────────
    if [osquery][result][name] == "new_processes" {
      mutate {
        rename => {
          "[osquery][result][columns][pid]"         => "[process][pid]"
          "[osquery][result][columns][name]"        => "[process][name]"
          "[osquery][result][columns][path]"        => "[process][executable]"
          "[osquery][result][columns][cmdline]"     => "[process][command_line]"
          "[osquery][result][columns][uid]"         => "[user][id]"
          "[osquery][result][columns][username]"    => "[user][name]"
          "[osquery][result][columns][parent]"      => "[process][parent][pid]"
          "[osquery][result][columns][parent_name]" => "[process][parent][name]"
        }
        add_field => {
          "[event][kind]"      => "event"
          "[event][category]"  => "process"
          "[event][type]"      => "start"
          "[event][action]"    => "process_start"
          "[event][outcome]"   => "success"
          "[@metadata][index]" => "process-events"
        }
      }
      mutate {
        convert => {
          "[process][pid]"         => "integer"
          "[process][parent][pid]" => "integer"
          "[user][id]"             => "integer"
        }
      }

    # ── process_connections → network-events ────────────────────────────────
    } else if [osquery][result][name] == "process_connections" {
      mutate {
        rename => {
          "[osquery][result][columns][pid]"            => "[process][pid]"
          "[osquery][result][columns][process_name]"   => "[process][name]"
          "[osquery][result][columns][process_path]"   => "[process][executable]"
          "[osquery][result][columns][username]"       => "[user][name]"
          "[osquery][result][columns][remote_address]" => "[destination][ip]"
          "[osquery][result][columns][remote_port]"    => "[destination][port]"
          "[osquery][result][columns][local_address]"  => "[source][ip]"
          "[osquery][result][columns][local_port]"     => "[source][port]"
          "[osquery][result][columns][protocol]"       => "[network][transport]"
          "[osquery][result][columns][state]"          => "[network][state]"
        }
        add_field => {
          "[event][kind]"      => "event"
          "[event][category]"  => "network"
          "[event][type]"      => "connection"
          "[event][action]"    => "network_connection"
          "[@metadata][index]" => "network-events"
        }
      }
      mutate {
        convert => {
          "[process][pid]"      => "integer"
          "[destination][port]" => "integer"
          "[source][port]"      => "integer"
        }
      }

    # ── logged_in_users_diff → auth-events ──────────────────────────────────
    } else if [osquery][result][name] == "logged_in_users_diff" {
      mutate {
        rename => {
          "[osquery][result][columns][user]" => "[user][name]"
          "[osquery][result][columns][host]" => "[related][hosts]"
          "[osquery][result][columns][pid]"  => "[process][pid]"
          "[osquery][result][columns][type]" => "[session][type]"
        }
        add_field => {
          "[event][kind]"      => "event"
          "[event][category]"  => "authentication"
          "[event][type]"      => "info"
          "[@metadata][index]" => "auth-events"
        }
      }
      if [osquery][result][action] == "added" {
        mutate { add_field => { "[event][action]" => "session_start" } }
      } else {
        mutate { add_field => { "[event][action]" => "session_end" } }
      }
      mutate { convert => { "[process][pid]" => "integer" } }

    # ── new_users → config-events ────────────────────────────────────────────
    } else if [osquery][result][name] == "new_users" {
      mutate {
        rename => {
          "[osquery][result][columns][uid]"         => "[user][id]"
          "[osquery][result][columns][username]"    => "[user][name]"
          "[osquery][result][columns][description]" => "[user][full_name]"
          "[osquery][result][columns][directory]"   => "[user][home]"
          "[osquery][result][columns][shell]"       => "[user][shell]"
        }
        add_field => {
          "[event][kind]"      => "event"
          "[event][category]"  => "iam"
          "[event][type]"      => "user"
          "[@metadata][index]" => "config-events"
        }
      }
      if [osquery][result][action] == "added" {
        mutate { add_field => { "[event][action]" => "user_created" } }
      } else {
        mutate { add_field => { "[event][action]" => "user_deleted" } }
      }
      mutate { convert => { "[user][id]" => "integer" } }

    # ── new_ssh_keys → config-events ─────────────────────────────────────────
    } else if [osquery][result][name] == "new_ssh_keys" {
      mutate {
        rename => {
          "[osquery][result][columns][uid]"      => "[user][id]"
          "[osquery][result][columns][username]" => "[user][name]"
          "[osquery][result][columns][key_file]" => "[file][path]"
          "[osquery][result][columns][key]"      => "[file][content]"
        }
        add_field => {
          "[event][kind]"      => "event"
          "[event][category]"  => "configuration"
          "[event][action]"    => "ssh_key_changed"
          "[@metadata][index]" => "config-events"
        }
      }
      mutate { convert => { "[user][id]" => "integer" } }

    # ── new_crontabs → config-events ─────────────────────────────────────────
    } else if [osquery][result][name] == "new_crontabs" {
      mutate {
        rename => {
          "[osquery][result][columns][command]" => "[process][command_line]"
          "[osquery][result][columns][path]"    => "[file][path]"
        }
        add_field => {
          "[event][kind]"      => "event"
          "[event][category]"  => "configuration"
          "[event][action]"    => "scheduled_task_changed"
          "[@metadata][index]" => "config-events"
        }
      }

    # ── new_kernel_modules → config-events ───────────────────────────────────
    } else if [osquery][result][name] == "new_kernel_modules" {
      mutate {
        rename => {
          "[osquery][result][columns][name]"    => "[package][name]"
          "[osquery][result][columns][status]"  => "[package][build_version]"
          "[osquery][result][columns][address]" => "[package][reference]"
        }
        add_field => {
          "[event][kind]"      => "event"
          "[event][category]"  => "configuration"
          "[@metadata][index]" => "config-events"
        }
      }
      if [osquery][result][action] == "added" {
        mutate { add_field => { "[event][action]" => "kernel_module_loaded" } }
      } else {
        mutate { add_field => { "[event][action]" => "kernel_module_unloaded" } }
      }

    # ── new_services → config-events ─────────────────────────────────────────
    } else if [osquery][result][name] == "new_services" {
      mutate {
        rename => {
          "[osquery][result][columns][name]"       => "[service][name]"
          "[osquery][result][columns][status]"     => "[service][state]"
          "[osquery][result][columns][path]"       => "[process][executable]"
          "[osquery][result][columns][start_type]" => "[service][type]"
        }
        add_field => {
          "[event][kind]"      => "event"
          "[event][category]"  => "configuration"
          "[event][action]"    => "service_changed"
          "[@metadata][index]" => "config-events"
        }
      }

    # ── new_listening_ports → config-events ──────────────────────────────────
    } else if [osquery][result][name] == "new_listening_ports" {
      mutate {
        rename => {
          "[osquery][result][columns][port]"         => "[server][port]"
          "[osquery][result][columns][protocol]"     => "[network][transport]"
          "[osquery][result][columns][address]"      => "[server][address]"
          "[osquery][result][columns][process_name]" => "[process][name]"
        }
        add_field => {
          "[event][kind]"      => "event"
          "[event][category]"  => "network"
          "[event][action]"    => "listening_port_changed"
          "[@metadata][index]" => "config-events"
        }
      }
      mutate { convert => { "[server][port]" => "integer" } }
    }

    # Удалить сырые колонки после нормализации
    mutate {
      remove_field => ["[osquery][result][columns]", "[osquery][result][decorations]"]
    }
  }

  # ===========================================================================
  # FILEBEAT — system/auth (sshd)
  # ECS нормализован filebeat: source.ip, user.name, event.outcome
  # ===========================================================================
  if [agent][type] == "filebeat" and [event][module] == "system"
      and [event][dataset] == "system.auth" {
    mutate {
      add_field => {
        "[host][os][type]"   => "linux"
        "[@metadata][index]" => "auth-events"
      }
    }
  }

  # ===========================================================================
  # SURICATA — сетевые события (TCP 5049, без изменений)
  # ===========================================================================
  if "suricata" in [tags] {
    if [event_type] == "flow" or [event_type] == "netflow" {
      mutate {
        rename => {
          "src_ip"   => "[source][ip]"
          "src_port" => "[source][port]"
          "dest_ip"  => "[destination][ip]"
          "dest_port"=> "[destination][port]"
          "proto"    => "[network][transport]"
        }
        add_field => {
          "[event][kind]"      => "event"
          "[event][category]"  => "network"
          "[event][action]"    => "network_flow"
          "[@metadata][index]" => "network-events"
        }
      }
    } else if [event_type] == "alert" {
      mutate {
        rename => {
          "src_ip"          => "[source][ip]"
          "dest_ip"         => "[destination][ip]"
          "dest_port"       => "[destination][port]"
          "alert.signature" => "[rule][name]"
          "alert.severity"  => "[event][severity]"
        }
        add_field => {
          "[event][kind]"      => "alert"
          "[event][category]"  => "network"
          "[event][action]"    => "ids_alert"
          "[@metadata][index]" => "network-events"
        }
      }
    }
  }

  # ===========================================================================
  # WINEVTLOG — Windows (stub, нормализация добавляется при подключении агента)
  # ===========================================================================
  if "winevtlog" in [tags] {
    mutate { add_field => { "[host][os][type]" => "windows" } }
  }

  # ===========================================================================
  # ОБЩЕЕ ОБОГАЩЕНИЕ
  # ===========================================================================

  # process.name из executable (basename) — для событий без явного имени
  if [process][executable] and ![process][name] {
    ruby {
      code => '
        exe = event.get("[process][executable]") || ""
        event.set("[process][name]", File.basename(exe.gsub("\\\\", "/")))
      '
    }
  }

  # Флаг выполнения из подозрительного пути
  if [process][executable] {
    ruby {
      code => '
        exe = event.get("[process][executable]") || ""
        suspicious = ["/tmp/", "/dev/shm/", "/var/tmp/", "/run/user/", "AppData/", "Temp/"]
        event.set("[process][from_suspicious_path]", suspicious.any? { |p| exe.include?(p) })
      '
    }
  }

  # host.name — fallback для TCP-источников (suricata, winevtlog)
  if ![host][name] and [hostname] {
    mutate { copy => { "hostname" => "[host][name]" } }
  }

  # Fallback индекс для нераспознанных событий
  if ![@metadata][index] {
    mutate { add_field => { "[@metadata][index]" => "ueba-other" } }
  }

  # Очистка служебных полей
  mutate {
    remove_field => [
      "hostname", "MESSAGE", "HOSTNAME", "PRIORITY",
      "_TRANSPORT", "_SYSTEMD_UNIT", "SYSLOG_IDENTIFIER"
    ]
  }
}

# =============================================================================
# OUTPUT — единая точка отправки в OpenSearch (индекс через [@metadata][index])
# =============================================================================
output {
  opensearch {
    hosts                        => ["${OPENSEARCH_URL:http://localhost:9200}"]
    user                         => "${OPENSEARCH_USER:}"
    password                     => "${OPENSEARCH_PASSWORD:}"
    # Прод: OPENSEARCH_SSL=true, OPENSEARCH_SSL_VERIFY=true + OPENSEARCH_CA_CERT=/path/to/ca.pem
    # Если сертификат без IP SAN — выставить OPENSEARCH_SSL_VERIFY=false (шифрование остаётся).
    # Dev-стенд: переменные не задаются, дефолты false — SSL отключён
    ssl                          => "${OPENSEARCH_SSL:false}"
    ssl_certificate_verification => "${OPENSEARCH_SSL_VERIFY:false}"
    cacert                       => "${OPENSEARCH_CA_CERT:}"
    index                        => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
    ecs_compatibility            => "disabled"
  }
  # Отладка — раскомментировать при необходимости
  # stdout { codec => rubydebug { metadata => false } }
}
