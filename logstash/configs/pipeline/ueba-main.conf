# =============================================================================
# ueba-main.conf
#
# Beats  5044: auditbeat + filebeat → {beat}-{version}-YYYY.MM.dd
# TCP    5045: fluent-bit auditd    → fluent-audit-YYYY.MM.dd
# TCP    5046: Windows winevtlog    → winevtlog-YYYY.MM.dd (stub)
# TCP    5049: Suricata eve.json    → suricata-YYYY.MM.dd
# =============================================================================

input {

  beats {
    port => 5044
  }

  # fluent-bit: auditd с ECS-обогащением (merge + enrich Lua)
  tcp {
    port      => 5045
    codec     => json_lines
    add_field => { "[@metadata][source]" => "fluent_auditd" }
  }

  tcp {
    port  => 5049
    codec => json_lines
    tags  => ["suricata"]
  }

  tcp {
    port  => 5046
    codec => json_lines
    tags  => ["winevtlog"]
  }
}

# =============================================================================
# FILTER
# =============================================================================
filter {

  # ── Beats: стандартное именование индекса ────────────────────────────────
  # [@metadata][beat]    — "auditbeat" / "filebeat"   (устанавливает сам beat)
  # [@metadata][version] — "9.4.1"                    (устанавливает сам beat)
  # Итоговый индекс: auditbeat-9.4.1-2026.05.15
  if [@metadata][beat] {
    mutate {
      add_field => { "[@metadata][index]" => "%{[@metadata][beat]}-%{[@metadata][version]}" }
    }
  }

  # ── Suricata (TCP 5049) ───────────────────────────────────────────────────
  if "suricata" in [tags] {
    if [event_type] == "flow" or [event_type] == "netflow" {
      mutate {
        rename => {
          "src_ip"    => "[source][ip]"
          "src_port"  => "[source][port]"
          "dest_ip"   => "[destination][ip]"
          "dest_port" => "[destination][port]"
          "proto"     => "[network][transport]"
        }
        add_field => {
          "[event][kind]"     => "event"
          "[event][category]" => "network"
          "[event][action]"   => "network_flow"
        }
      }
    } else if [event_type] == "alert" {
      mutate {
        rename => {
          "src_ip"          => "[source][ip]"
          "dest_ip"         => "[destination][ip]"
          "dest_port"       => "[destination][port]"
          "alert.signature" => "[rule][name]"
          "alert.severity"  => "[event][severity]"
        }
        add_field => {
          "[event][kind]"     => "alert"
          "[event][category]" => "network"
          "[event][action]"   => "ids_alert"
        }
      }
    }
    mutate { add_field => { "[@metadata][index]" => "suricata" } }
  }

  # ── Windows winevtlog (TCP 5046, stub) ────────────────────────────────────
  if "winevtlog" in [tags] {
    mutate {
      add_field => {
        "[host][os][type]"   => "windows"
        "[@metadata][index]" => "winevtlog"
      }
    }
  }

  # ── fluent-bit auditd (TCP 5045) ─────────────────────────────────────────
  # Поля ECS уже выставлены Lua-скриптами на стороне fluent-bit.
  # Здесь только выставляем целевой индекс и нормализуем числовые типы.
  if [@metadata][source] == "fluent_auditd" {
    mutate {
      add_field => { "[@metadata][index]" => "fluent-audit" }
      convert   => {
        "process.pid"        => "integer"
        "process.parent.pid" => "integer"
        "process.args_count" => "integer"
        "auditd.session"     => "integer"
      }
    }
  }

  # ── host.name — fallback для TCP-источников (suricata, winevtlog) ─────────
  if ![host][name] and [hostname] {
    mutate { copy => { "hostname" => "[host][name]" } }
  }

  # ── Fallback для нераспознанных источников ────────────────────────────────
  if ![@metadata][index] {
    mutate { add_field => { "[@metadata][index]" => "logstash" } }
  }

  mutate {
    remove_field => [
      "hostname", "MESSAGE", "HOSTNAME", "PRIORITY",
      "_TRANSPORT", "_SYSTEMD_UNIT", "SYSLOG_IDENTIFIER"
    ]
  }
}

# =============================================================================
# OUTPUT
# =============================================================================
output {
  opensearch {
    hosts                        => ["${OPENSEARCH_URL:http://localhost:9200}"]
    user                         => "${OPENSEARCH_USER:}"
    password                     => "${OPENSEARCH_PASSWORD:}"
    ssl                          => "${OPENSEARCH_SSL:false}"
    ssl_certificate_verification => "${OPENSEARCH_SSL_VERIFY:false}"
    cacert                       => "${OPENSEARCH_CA_CERT:}"
    index                        => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
    ecs_compatibility            => "disabled"
  }
  # stdout { codec => rubydebug { metadata => false } }
}
