# =============================================================================
# ueba-main.conf — единый нормализующий пайплайн
# Источники: osquery (TCP 5048), auditd/sshd (TCP 5045/5047), suricata (TCP 5049)
# Выход: OpenSearch индексы по типу события
# =============================================================================

input {

  # osquery results (snapshot + diff) от fluent-bit
  tcp {
    port  => 5048
    codec => json_lines
    tags  => ["osquery"]
  }

  # auditd события от fluent-bit systemd
  tcp {
    port  => 5045
    codec => json_lines
    tags  => ["auditd"]
  }

  # sshd события от fluent-bit systemd
  tcp {
    port  => 5047
    codec => json_lines
    tags  => ["sshd"]
  }

  # Suricata NetFlow / alerts
  tcp {
    port  => 5049
    codec => json_lines
    tags  => ["suricata"]
  }

  # Windows winevtlog (для будущего расширения)
  tcp {
    port  => 5046
    codec => json_lines
    tags  => ["winevtlog"]
  }
}

# =============================================================================
# FILTER — парсинг и нормализация
# =============================================================================
filter {

  # ==========================================================================
  # OSQUERY — snapshot метрики и diff события
  # flatten.lua в fluent-bit уже преобразовал данные:
  #   snapshot: { metric_name, value, entity_id, entity_type, query_name, action="snapshot" }
  #   diff:     { <columns_fields>, query_name, entity_id, action="added"|"removed" }
  # ==========================================================================
  if "osquery" in [tags] {

    # Snapshot: метрики для AD детекторов
    if [action] == "snapshot" {
      mutate {
        add_field => {
          "[event][kind]"      => "metric"
          "[event][category]"  => "metric"
          "[decoder][name]"    => "osquery"
          "location"           => "/var/log/osquery/osqueryd.snapshots.log"
        }
      }
      mutate {
        copy    => { "entity_id" => "[agent][name]" }
        convert => { "value" => "float" }
      }
      ruby { code => 'event.tag("osquery_metric")' }
    }

    # Diff: added/removed — flatten_diff уже разложил columns в top-level поля
    if [action] in ["added", "removed"] {
      ruby {
        code => '
          qname    = event.get("query_name") || event.get("name") || ""
          hostname = event.get("entity_id")  || event.get("hostname") || "unknown"

          action_map = {
            "new_listening_ports"  => "port_change",
            "new_processes"        => "process_start",
            "new_services"         => "service_change",
            "new_scheduled_tasks"  => "task_change",
            "new_users"            => "user_change",
            "new_crontabs"         => "cron_change",
            "new_ssh_keys"         => "ssh_key_change",
            "new_kernel_modules"   => "module_change",
            "logged_in_users_diff" => "session_change",
            "process_connections"  => "network_connection"
          }
          cat_map = {
            "new_listening_ports"  => "network",
            "new_processes"        => "process",
            "new_services"         => "configuration",
            "new_scheduled_tasks"  => "configuration",
            "new_users"            => "iam",
            "new_crontabs"         => "configuration",
            "new_ssh_keys"         => "configuration",
            "new_kernel_modules"   => "configuration",
            "logged_in_users_diff" => "authentication",
            "process_connections"  => "network"
          }

          event.set("diff_action",         event.get("action"))
          event.set("[event][kind]",       "event")
          event.set("[event][action]",     action_map[qname] || qname)
          event.set("[event][category]",   cat_map[qname]    || "configuration")
          event.set("[agent][name]",       hostname)
          event.set("[decoder][name]",     "osquery")
          event.set("location",            "/var/log/osquery/osqueryd.results.log")
          event.tag("osquery_diff")
        '
      }

      # ── ECS нормализация: пользователь ────────────────────────────────────
      if [username] {
        mutate { rename => { "username" => "[user][name]" } }
      }
      if [uid] {
        mutate {
          rename  => { "uid" => "[user][id]" }
          convert => { "[user][id]" => "integer" }
        }
      }

      # ── ECS нормализация: процесс (new_processes diff → process-events) ──
      if [event][action] == "process_start" {
        if [name]        { mutate { rename => { "name"        => "[process][name]"        } } }
        if [path]        { mutate { rename => { "path"        => "[process][executable]"  } } }
        if [cmdline]     { mutate { rename => { "cmdline"     => "[process][command_line]" } } }
        if [parent_name] { mutate { rename => { "parent_name" => "[process][parent][name]" } } }
        if [pid] {
          mutate {
            rename  => { "pid"    => "[process][pid]" }
            convert => { "[process][pid]" => "integer" }
          }
        }
        if [parent] {
          mutate {
            rename  => { "parent" => "[process][parent][pid]" }
            convert => { "[process][parent][pid]" => "integer" }
          }
        }
      }

      # ── ECS нормализация: сессия (logged_in_users_diff → auth-events) ────
      if [event][action] == "session_change" {
        if [user] { mutate { rename => { "user" => "[user][name]" } } }
        # host из logged_in_users: tty или remote hostname — переименовываем
        # чтобы не конфликтовать с ECS-объектом host.*
        if [host] { mutate { rename => { "host" => "session_host" } } }
        if [pid] {
          mutate {
            rename  => { "pid" => "[process][pid]" }
            convert => { "[process][pid]" => "integer" }
          }
        }
      }

      # ── ECS нормализация: исходящие соединения (process_connections → network-events) ──
      if [event][action] == "network_connection" {
        if [process_name]   { mutate { rename => { "process_name"   => "[process][name]"       } } }
        if [process_path]   { mutate { rename => { "process_path"   => "[process][executable]" } } }
        if [remote_address] { mutate { rename => { "remote_address" => "[destination][ip]"     } } }
        if [local_address]  { mutate { rename => { "local_address"  => "[source][ip]"          } } }
        if [protocol]       { mutate { rename => { "protocol"       => "[network][transport]"  } } }
        if [state]          { mutate { rename => { "state"          => "[network][state]"      } } }
        if [pid] {
          mutate { rename  => { "pid" => "[process][pid]" } }
          mutate { convert => { "[process][pid]" => "integer" } }
        }
        if [remote_port] {
          mutate { rename  => { "remote_port" => "[destination][port]" } }
          mutate { convert => { "[destination][port]" => "integer" } }
        }
        if [local_port] {
          mutate { rename  => { "local_port" => "[source][port]" } }
          mutate { convert => { "[source][port]" => "integer" } }
        }
      }
    }
  }

  # ==========================================================================
  # AUDITD — системные вызовы Linux
  # ==========================================================================
  if "auditd" in [tags] {

    # Парсим сырую строку из journald MESSAGE
    if [MESSAGE] {
      grok {
        match => {
          "MESSAGE" => "type=%{WORD:[auditd][type]} msg=audit\(%{NUMBER:[auditd][epoch]}:%{NUMBER:[auditd][seq]}\): %{GREEDYDATA:[auditd][body]}"
        }
        tag_on_failure => ["_auditd_header_fail"]
      }
    }

    # Вспомогательные записи auditd — суб-записи к SYSCALL, не нужны как отдельные события
    if [auditd][type] in ["PROCTITLE", "EXECVE", "PATH", "CWD", "EOE"] {
      drop {}
    }

    # SYSCALL execve → process_start / privilege_use (sudo/su)
    if [auditd][type] == "SYSCALL" {
      grok {
        match => {
          "[auditd][body]" => [
            "arch=%{DATA} syscall=%{NUMBER:[auditd][syscall_num]} success=%{WORD:[auditd][success]} exit=%{INT:[auditd][exit_code]} %{DATA} ppid=%{INT:[auditd][ppid]} pid=%{INT:[auditd][pid]} auid=%{INT:[auditd][auid]} uid=%{INT:[auditd][uid]} gid=%{INT:[auditd][gid]} %{DATA} comm=\"%{DATA:[auditd][comm]}\" exe=\"%{DATA:[auditd][exe]}\"%{GREEDYDATA}"
          ]
        }
        tag_on_failure => ["_auditd_syscall_fail"]
      }

      # Извлекаем ключ правила auditd (опциональное поле в конце body)
      grok {
        match => { "[auditd][body]" => " key=\"%{DATA:[auditd][key]}\"" }
        tag_on_failure => []
      }

      # Извлекаем имя пользователя из интерпретированной части записи auditd (UID="name")
      grok {
        match => { "[auditd][body]" => " UID=\"%{DATA:[auditd][username]}\"" }
        tag_on_failure => []
      }

      if [auditd][syscall_num] == "59" {
        # execve — тип события зависит от ключа правила
        if [auditd][key] == "sudo_exec" {
          mutate {
            add_field => {
              "[event][kind]"         => "event"
              "[event][category]"     => "authentication"
              "[event][action]"       => "privilege_use"
              "[host][os][type]"      => "linux"
              "[process][executable]" => "%{[auditd][exe]}"
              "[process][name]"       => "%{[auditd][comm]}"
              "[decoder][name]"       => "auditd"
              "location"              => "/var/log/audit/audit.log"
            }
          }
        } else {
          mutate {
            add_field => {
              "[event][kind]"         => "event"
              "[event][category]"     => "process"
              "[event][action]"       => "process_start"
              "[host][os][type]"      => "linux"
              "[process][executable]" => "%{[auditd][exe]}"
              "[process][name]"       => "%{[auditd][comm]}"
              "[decoder][name]"       => "auditd"
              "location"              => "/var/log/audit/audit.log"
            }
          }
        }
        if [auditd][success] == "yes" {
          mutate { add_field => { "[event][outcome]" => "success" } }
        } else {
          mutate { add_field => { "[event][outcome]" => "failure" } }
        }
        mutate {
          convert => {
            "[auditd][pid]"  => "integer"
            "[auditd][ppid]" => "integer"
            "[auditd][uid]"  => "integer"
            "[auditd][auid]" => "integer"
          }
        }
        mutate {
          rename => {
            "[auditd][pid]"  => "[process][pid]"
            "[auditd][ppid]" => "[process][parent][pid]"
            "[auditd][uid]"  => "[user][id]"
            "[auditd][auid]" => "[user][audit_id]"
          }
        }
        if [auditd][username] {
          mutate { rename => { "[auditd][username]" => "[user][name]" } }
        }
      }
    }

    # USER_AUTH / USER_LOGIN → authentication
    if [auditd][type] in ["USER_AUTH", "USER_LOGIN", "USER_START", "USER_END"] {
      grok {
        match => {
          "[auditd][body]" => [
            "pid=%{INT:[auditd][pid]} uid=%{INT:[auditd][uid]} auid=%{INT:[auditd][auid]} ses=%{INT:[auditd][ses]} %{DATA}acct=\"%{DATA:[auditd][acct]}\" exe=\"%{DATA:[auditd][exe]}\" hostname=%{DATA:[auditd][hostname]} addr=(%{IP:[auditd][addr]}|\\?) terminal=%{DATA:[auditd][terminal]} res=%{WORD:[auditd][res]}"
          ]
        }
        tag_on_failure => ["_auditd_userauth_fail"]
      }

      mutate {
        add_field => {
          "[event][kind]"     => "event"
          "[event][category]" => "authentication"
          "[host][os][type]"  => "linux"
          "[decoder][name]"   => "auditd"
          "location"          => "/var/log/audit/audit.log"
        }
      }

      if [auditd][res] == "success" {
        mutate { add_field => { "[event][action]" => "login" "[event][outcome]" => "success" } }
      } else {
        mutate { add_field => { "[event][action]" => "login_failed" "[event][outcome]" => "failure" } }
      }

      mutate {
        rename => {
          "[auditd][acct]"     => "[user][name]"
          "[auditd][addr]"     => "[source][ip]"
          "[auditd][hostname]" => "[source][domain]"
        }
      }
    }

    # PROCTITLE → командная строка процесса (process.command_line)
    if [auditd][type] == "PROCTITLE" {
      grok {
        match => { "[auditd][body]" => "proctitle=%{GREEDYDATA:[auditd][proctitle]}" }
        tag_on_failure => ["_auditd_proctitle_fail"]
      }

      ruby {
        code => '
          raw = (event.get("[auditd][proctitle]") || "").strip
          if raw =~ /\A[0-9A-Fa-f]+\z/ && raw.length.even?
            begin
              cmdline = [raw].pack("H*").gsub("\x00", " ").strip
              event.set("[process][command_line]", cmdline)
            rescue
              event.set("[process][command_line]", raw)
            end
          else
            event.set("[process][command_line]", raw)
          end
        '
      }

      mutate {
        add_field => {
          "[event][kind]"     => "event"
          "[event][category]" => "process"
          "[event][action]"   => "process_start"
          "[event][outcome]"  => "success"
          "[decoder][name]"   => "auditd"
          "location"          => "/var/log/audit/audit.log"
        }
      }
    }

    if ![agent][name] {
      mutate { add_field => { "[agent][name]" => "%{[hostname]}" } }
    }
  }

  # ==========================================================================
  # SSHD — логины через journald
  # ==========================================================================
  if "sshd" in [tags] {

    # syslog_no_pri парсер кладёт host как строку; убираем — ниже ставим [host][os][type] объектом
    mutate { remove_field => ["host"] }

    grok {
      match => {
        "MESSAGE" => [
          "Accepted %{WORD:[sshd][auth_method]} for %{DATA:[sshd][user]} from %{IP:[sshd][src_ip]} port %{INT:[sshd][src_port]}",
          "Failed %{WORD:[sshd][auth_method]} for %{DATA:[sshd][user]} from %{IP:[sshd][src_ip]} port %{INT:[sshd][src_port]}",
          "Failed %{WORD:[sshd][auth_method]} for invalid user %{DATA:[sshd][user]} from %{IP:[sshd][src_ip]} port %{INT:[sshd][src_port]}",
          "Invalid user %{DATA:[sshd][user]} from %{IP:[sshd][src_ip]} port %{INT:[sshd][src_port]}",
          "Disconnected from %{IP:[sshd][src_ip]} port %{INT:[sshd][src_port]}",
          "session %{WORD:[sshd][session_action]} for user %{DATA:[sshd][user]}"
        ]
      }
      tag_on_failure => ["_sshd_parse_fail"]
    }

    mutate {
      add_field => {
        "[event][kind]"     => "event"
        "[event][category]" => "authentication"
        "[host][os][type]"  => "linux"
        "[decoder][name]"   => "sshd"
        "location"          => "journald"
      }
    }

    if [MESSAGE] =~ /^Accepted/ {
      mutate { add_field => { "[event][action]" => "login" "[event][outcome]" => "success" } }
    } else if [MESSAGE] =~ /Failed|Invalid user/ {
      mutate { add_field => { "[event][action]" => "login_failed" "[event][outcome]" => "failure" } }
    }

    if [sshd][user]   { mutate { rename => { "[sshd][user]"    => "[user][name]" } } }
    if [sshd][src_ip] { mutate { rename => { "[sshd][src_ip]"  => "[source][ip]" } } }
    mutate { convert => { "[sshd][src_port]" => "integer" } }
    mutate { rename => { "[sshd][src_port]" => "[source][port]" } }

    mutate { add_field => { "[agent][name]" => "%{[hostname]}" } }
  }

  # ==========================================================================
  # SURICATA — сетевые события
  # ==========================================================================
  if "suricata" in [tags] {

    if [event_type] == "flow" or [event_type] == "netflow" {
      mutate {
        add_field => {
          "[event][kind]"     => "event"
          "[event][category]" => "network"
          "[event][action]"   => "network_flow"
          "[decoder][name]"   => "suricata"
          "location"          => "/var/log/suricata/eve.json"
        }
      }
      mutate {
        rename => {
          "src_ip"   => "[source][ip]"
          "src_port" => "[source][port]"
          "dest_ip"  => "[destination][ip]"
          "dest_port"=> "[destination][port]"
          "proto"    => "[network][transport]"
        }
      }
    }

    if [event_type] == "alert" {
      mutate {
        add_field => {
          "[event][kind]"     => "alert"
          "[event][category]" => "network"
          "[event][action]"   => "ids_alert"
          "[decoder][name]"   => "suricata"
        }
      }
      mutate {
        rename => {
          "src_ip"          => "[source][ip]"
          "dest_ip"         => "[destination][ip]"
          "dest_port"       => "[destination][port]"
          "alert.signature" => "[rule][name]"
          "alert.severity"  => "[event][severity]"
        }
      }
    }
  }

  # ==========================================================================
  # WINEVTLOG (Windows — будущее расширение)
  # ==========================================================================
  if "winevtlog" in [tags] {
    mutate { add_field => { "[host][os][type]" => "windows" "[decoder][name]" => "winevtlog" "location" => "eventlog" } }
    # Нормализация добавляется при подключении Windows агента
  }

  # ==========================================================================
  # ОБЩЕЕ ОБОГАЩЕНИЕ — для всех событий
  # ==========================================================================

  # agent.name + host.name — fallback для событий без явной установки (suricata и др.)
  if ![agent][name] {
    if [hostname]        { mutate { add_field => { "[agent][name]" => "%{[hostname]}" } } }
    else if [host][name] { mutate { copy      => { "[host][name]"  => "[agent][name]" } } }
    else                 { mutate { add_field => { "[agent][name]" => "unknown" } } }
  }
  if ![host][name] {
    mutate { copy => { "[agent][name]" => "[host][name]" } }
  }

  # process.name из executable (basename)
  if [process][executable] and ![process][name] {
    ruby {
      code => '
        exe = event.get("[process][executable]") || ""
        event.set("[process][name]", File.basename(exe.gsub("\\\\", "/")))
      '
    }
  }

  # Флаг подозрительного пути
  if [process][executable] {
    ruby {
      code => '
        exe = event.get("[process][executable]") || ""
        suspicious = ["/tmp/", "/dev/shm/", "/var/tmp/", "/run/user/", "AppData/", "Temp/"]
        event.set("[process][from_suspicious_path]", suspicious.any? { |p| exe.include?(p) })
      '
    }
  }

  # # Время суток — для всех событий (auth, process, config, network)
  # ruby {
  #   code => '
  #     ts = event.get("@timestamp")
  #     if ts
  #       h = ts.time.hour
  #       w = ts.time.wday
  #       event.set("[event][hour_of_day]",  h)
  #       event.set("[event][day_of_week]",  w)
  #       event.set("[event][is_offhours]",  h < 6 || h >= 22 || w == 0 || w == 6)
  #     end
  #   '
  # }

  # # ==========================================================================
  # # RULE — Wazuh-совместимая классификация событий
  # # rule.id / rule.level / rule.description / rule.groups / rule.mitre.*
  # # ==========================================================================
  # ruby {
  #   code => '
  #     action     = event.get("[event][action]")  || ""
  #     outcome    = event.get("[event][outcome]") || ""
  #     suspicious = event.get("[process][from_suspicious_path]") == true

  #     if action == "process_start" && suspicious
  #       event.set("[rule][id]",          "80784")
  #       event.set("[rule][level]",       12)
  #       event.set("[rule][description]", "Audit: suspicious command executed from temp/run path.")
  #       event.set("[rule][groups]",      ["audit", "suspicious_command", "attack", "linux"])
  #       event.set("[rule][mitre][id]",        ["T1059", "T1036"])
  #       event.set("[rule][mitre][tactic]",    ["Execution", "Defense Evasion"])
  #       event.set("[rule][mitre][technique]", ["Command and Scripting Interpreter", "Masquerading"])
  #     else
  #       rules = {
  #         ["login",          "success"] => ["5715",  3,  "sshd: authentication success.",           ["authentication_success", "sshd", "pam"],              ["T1078"], ["Defense Evasion","Persistence","Privilege Escalation","Initial Access"], ["Valid Accounts"]],
  #         ["login",          "failure"] => ["5716",  5,  "PAM: login failed.",                      ["authentication_failed",  "pam",  "linux"],            ["T1110"], ["Credential Access"],                                                   ["Brute Force"]],
  #         ["login_failed",   "failure"] => ["5716",  5,  "sshd: authentication failed.",            ["authentication_failed",  "sshd", "pam"],              ["T1110"], ["Credential Access"],                                                   ["Brute Force"]],
  #         ["process_start",  "success"] => ["80792", 3,  "Audit: Command executed.",                ["audit", "audit_command", "linux"],                    ["T1059"], ["Execution"],                                                           ["Command and Scripting Interpreter"]],
  #         ["process_start",  "failure"] => ["80792", 3,  "Audit: Command execution failed.",        ["audit", "audit_command", "linux"],                    ["T1059"], ["Execution"],                                                           ["Command and Scripting Interpreter"]],
  #         ["user_change",    ""]        => ["5902",  8,  "osquery: user account changed.",          ["account_changed", "osquery", "linux"],                ["T1136"], ["Persistence"],                                                         ["Create Account"]],
  #         ["service_change", ""]        => ["5902",  7,  "osquery: service/daemon changed.",        ["service_changed", "osquery", "linux"],                ["T1543"], ["Persistence","Privilege Escalation"],                                  ["Create or Modify System Process"]],
  #         ["task_change",    ""]        => ["5902",  7,  "osquery: scheduled task changed.",        ["scheduled_task",  "osquery", "linux"],                ["T1053"], ["Execution","Persistence","Privilege Escalation"],                      ["Scheduled Task/Job"]],
  #         ["cron_change",    ""]        => ["5902",  7,  "osquery: crontab entry changed.",         ["cron", "osquery", "linux"],                           ["T1053"], ["Execution","Persistence","Privilege Escalation"],                      ["Scheduled Task/Job"]],
  #         ["ssh_key_change", ""]        => ["5899",  10, "osquery: SSH authorized key changed.",    ["key_changed", "authentication", "osquery", "linux"],  ["T1098"], ["Persistence"],                                                         ["Account Manipulation"]],
  #         ["module_change",  ""]        => ["5904",  10, "osquery: kernel module loaded/removed.",  ["kernel_module", "osquery", "linux"],                  ["T1547"], ["Persistence","Privilege Escalation"],                                  ["Boot or Logon Autostart Execution"]],
  #         ["port_change",    ""]        => ["99001", 5,  "osquery: listening port changed.",        ["network", "port_change", "osquery", "linux"],         ["T1571"], ["Command and Control"],                                                 ["Non-Standard Port"]],
  #         ["session_change", ""]        => ["5501",  3,  "osquery: login session changed.",         ["session_start", "pam", "osquery", "linux"],           ["T1078"], ["Defense Evasion","Persistence"],                                       ["Valid Accounts"]],
  #         ["network_flow",      ""]        => ["99010", 3,  "Suricata: network flow.",                          ["network", "suricata"],                                nil, nil, nil],
  #         ["ids_alert",         ""]        => ["86601", 10, "Suricata: IDS alert.",                         ["ids_alert", "attack", "suricata"],                    nil, nil, nil],
  #         ["network_connection",""]        => ["99020", 3,  "osquery: outbound process network connection.", ["network", "osquery", "linux"],                        ["T1071"], ["Command and Control"],    ["Application Layer Protocol"]],
  #         ["privilege_use",     "success"] => ["5402",  8,  "Audit: Privilege escalation via sudo/su.",      ["sudo", "privilege_escalation", "linux"],              ["T1548"], ["Privilege Escalation"],   ["Abuse Elevation Control Mechanism"]],
  #         ["privilege_use",     "failure"] => ["5402",  8,  "Audit: Privilege escalation via sudo/su failed.", ["sudo", "privilege_escalation", "linux"],            ["T1548"], ["Privilege Escalation"],   ["Abuse Elevation Control Mechanism"]]
  #       }

  #       key = [action, outcome]
  #       r   = rules[key] || rules[[action, ""]]

  #       if r
  #         event.set("[rule][id]",          r[0])
  #         event.set("[rule][level]",       r[1])
  #         event.set("[rule][description]", r[2])
  #         event.set("[rule][groups]",      r[3])
  #         if r[4]
  #           event.set("[rule][mitre][id]",        r[4])
  #           event.set("[rule][mitre][tactic]",    r[5])
  #           event.set("[rule][mitre][technique]", r[6])
  #         end
  #       else
  #         event.set("[rule][id]",          "99999")
  #         event.set("[rule][level]",       1)
  #         event.set("[rule][description]", action.empty? ? "unclassified event" : action)
  #         event.set("[rule][groups]",      ["ueba"])
  #       end
  #     end
  #   '
  # }

  # Маршрутизация на индекс — определяем здесь, чтобы output был один
  if "osquery_metric" in [tags] {
    mutate { add_field => { "[@metadata][index]" => "host-metrics" } }
  } else if [event][category] == "process" {
    mutate { add_field => { "[@metadata][index]" => "process-events" } }
  } else if [decoder][name] == "suricata" or [event][action] == "network_connection" {
    mutate { add_field => { "[@metadata][index]" => "network-events" } }
  } else if [event][category] == "authentication" {
    mutate { add_field => { "[@metadata][index]" => "auth-events" } }
  } else if [event][category] in ["configuration", "iam", "network"] or "osquery_diff" in [tags] {
    mutate { add_field => { "[@metadata][index]" => "config-events" } }
  } else {
    mutate { add_field => { "[@metadata][index]" => "ueba-other" } }
  }

  # Очистка
  mutate {
    remove_field => ["auditd", "sshd", "ueba", "hostname", "MESSAGE", "HOSTNAME",
                     "PRIORITY", "_TRANSPORT", "_SYSTEMD_UNIT",
                     "SYSLOG_IDENTIFIER"]
  }
}

# =============================================================================
# OUTPUT — единая точка отправки в OpenSearch (индекс через [@metadata][index])
# =============================================================================
output {
  opensearch {
    hosts                        => ["${OPENSEARCH_URL:http://localhost:9200}"]
    user                         => "${OPENSEARCH_USER:}"
    password                     => "${OPENSEARCH_PASSWORD:}"
    # Прод: OPENSEARCH_SSL=true, OPENSEARCH_SSL_VERIFY=true + OPENSEARCH_CA_CERT=/path/to/ca.pem
    # Если сертификат без IP SAN — выставить OPENSEARCH_SSL_VERIFY=false (шифрование остаётся).
    # Dev-стенд: переменные не задаются, дефолты false — SSL отключён
    ssl                          => "${OPENSEARCH_SSL:false}"
    ssl_certificate_verification => "${OPENSEARCH_SSL_VERIFY:false}"
    cacert                       => "${OPENSEARCH_CA_CERT:}"
    index                        => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
    ecs_compatibility            => "disabled"
  }
  # Отладка — раскомментировать при необходимости
  # stdout { codec => rubydebug { metadata => false } }
}
