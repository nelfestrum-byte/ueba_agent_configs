# =============================================================================
# ueba-main.conf
#
# Beats  5044: beats relay            → {beat}-{version}-YYYY.MM.dd
# TCP    5045: fluent-bit auditd      → fluent-audit-YYYY.MM.dd
# TCP    5047: fluent-bit osquery     → fluent-osquery-YYYY.MM.dd
# TCP    5048: fluent-bit system-auth → system-auth-YYYY.MM.dd
# =============================================================================

input {

  beats {
    port => 5044
  }

  # fluent-bit: auditd с ECS-обогащением (merge + enrich Lua)
  tcp {
    port      => 5045
    codec     => json_lines
    add_field => { "[@metadata][source]" => "fluent_auditd" }
  }

  # fluent-bit: osquery diff-события с ECS-обогащением (Lua enrich)
  tcp {
    port      => 5047
    codec     => json_lines
    add_field => { "[@metadata][source]" => "fluent_osquery" }
  }

  # fluent-bit: SSH auth из /var/log/auth.log с ECS-обогащением (sshd_enrich.lua)
  tcp {
    port      => 5048
    codec     => json_lines
    add_field => { "[@metadata][source]" => "fluent_sysauth" }
  }
}

# =============================================================================
# FILTER
# =============================================================================
filter {

  # ── Beats: стандартное именование индекса ────────────────────────────────
  # [@metadata][beat]    — "filebeat" / etc.            (устанавливает сам beat)
  # [@metadata][version] — "9.4.1"                    (устанавливает сам beat)
  # Итоговый индекс: filebeat-9.4.1-2026.05.15
  if [@metadata][beat] {
    mutate {
      add_field => { "[@metadata][index]" => "%{[@metadata][beat]}-%{[@metadata][version]}" }
    }
  }

  # ── fluent-bit auditd (TCP 5045) ─────────────────────────────────────────
  # Поля ECS уже выставлены Lua-скриптами на стороне fluent-bit.
  # Здесь только выставляем целевой индекс и нормализуем числовые типы.
  if [@metadata][source] == "fluent_auditd" {
    mutate {
      add_field => { "[@metadata][index]" => "fluent-audit" }
      convert   => {
        "process.pid"        => "integer"
        "process.parent.pid" => "integer"
        "process.args_count" => "integer"
        "auditd.session"     => "integer"
      }
    }
  }

  # ── fluent-bit osquery (TCP 5047) ─────────────────────────────────────────
  # Поля ECS и osquery.* выставлены Lua-скриптом osquery_enrich.lua.
  # Нормализуем числовые типы и выставляем целевой индекс.
  if [@metadata][source] == "fluent_osquery" {
    mutate {
      add_field => { "[@metadata][index]" => "fluent-osquery" }
      convert   => {
        "process.pid"        => "integer"
        "process.parent.pid" => "integer"
        "destination.port"   => "integer"
        "source.port"        => "integer"
      }
    }
  }

  # ── fluent-bit system-auth (TCP 5048) ─────────────────────────────────────
  # Поля ECS выставлены Lua-скриптом sshd_enrich.lua.
  # Нормализуем числовые типы и выставляем целевой индекс.
  if [@metadata][source] == "fluent_sysauth" {
    mutate {
      add_field => { "[@metadata][index]" => "system-auth" }
      convert   => {
        "source.port"    => "integer"
        "process.pid"    => "integer"
      }
    }
  }

  # ── host.name — fallback для TCP-источников ──────────────────────────────
  if ![host][name] and [hostname] {
    mutate { copy => { "hostname" => "[host][name]" } }
  }

  # ── Fallback для нераспознанных источников ────────────────────────────────
  if ![@metadata][index] {
    mutate { add_field => { "[@metadata][index]" => "logstash" } }
  }

  mutate {
    remove_field => [
      "hostname", "MESSAGE", "HOSTNAME", "PRIORITY",
      "_TRANSPORT", "_SYSTEMD_UNIT", "SYSLOG_IDENTIFIER"
    ]
  }
}

# =============================================================================
# OUTPUT
# =============================================================================
output {
  opensearch {
    hosts                        => ["${OPENSEARCH_URL:http://localhost:9200}"]
    user                         => "${OPENSEARCH_USER:}"
    password                     => "${OPENSEARCH_PASSWORD:}"
    ssl                          => "${OPENSEARCH_SSL:false}"
    ssl_certificate_verification => "${OPENSEARCH_SSL_VERIFY:false}"
    cacert                       => "${OPENSEARCH_CA_CERT:}"
    index                        => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
    ecs_compatibility            => "disabled"
  }
  # stdout { codec => rubydebug { metadata => false } }
}
